      # cannot be executed here; hm-windows-test runs their smoke tests.
      run: bash scripts/verify-hm.sh ${{ matrix.rid }} ${{ matrix.rid == 'win-x64' && 'link' || 'all' }}
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-hm-${{ matrix.rid }}
        if-no-files-found: error
        retention-days: 1
        path: |
           TAppEncoder-${{ matrix.rid }}*
           TAppDecoder-${{ matrix.rid }}*

  hm-windows-test:
    runs-on: ${{ fromJSON(needs.build-plan.outputs.reuse)['hm-windows-test'] && 'ubuntu-latest' || 'windows-latest' }}
    needs: [build-plan, hm]
    env:
