    - if: env.REUSE != 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: binaries-hm-win-x64
        path: .
    - name: Smoke test
      if: env.REUSE != 'true'
      shell: bash
      run: bash scripts/verify-hm.sh win-x64 run

  # The HEVC tools are published to be compared with each other. This runs them
  # together on every platform (scripts/verify-hevc.sh): the streams of x265,
  # kvazaar, HM and heif-enc are decoded by ffmpeg, dec265 and TAppDecoder,
  # which must write the same pictures.
  hevc-test:
    needs: [build-plan, ffmpeg-linux, ffmpeg-linux-arm64, ffmpeg-windows, ffmpeg-osx-arm64, libheif, hm]
    strategy:
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
            ffmpeg: binaries-ffmpeg-linux
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            ffmpeg: binaries-ffmpeg-linux-arm64
          - rid: win-x64
            os: windows-latest
            ffmpeg: binaries-ffmpeg-windows
          - rid: osx-arm64
            os: macos-latest
            ffmpeg: binaries-ffmpeg-osx-arm64
    runs-on: ${{ fromJSON(needs.build-plan.outputs.reuse)[format('hevc-test-{0}', matrix.rid)] && 'ubuntu-latest' || matrix.os }}
    env:
      REUSE: ${{ fromJSON(needs.build-plan.outputs.reuse)[format('hevc-test-{0}', matrix.rid)] }}
    steps:
    - if: env.REUSE != 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - if: env.REUSE != 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: ${{ matrix.ffmpeg }}
        path: .
    - if: env.REUSE != 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: binaries-libheif-${{ matrix.rid }}
        path: .
    - if: env.REUSE != 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: binaries-hm-${{ matrix.rid }}
        path: .
    - name: Compare the encoders and the decoders
      if: env.REUSE != 'true'
      shell: bash
      run: bash scripts/verify-hevc.sh ${{ matrix.rid }}

  ffmpeg-linux:
    needs: [build-plan]
    runs-on: ubuntu-latest
    env:
      REUSE: ${{ fromJSON(needs.build-plan.outputs.reuse)['binaries-ffmpeg-linux'] }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Download the binaries of the previous release
      if: env.REUSE == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: ./scripts/Get-ReleaseFiles.ps1 -Tag "${{ needs.build-plan.outputs.release }}" -Artifact binaries-ffmpeg-linux
    - id: ffmpeg-deps-key
      if: env.REUSE != 'true'
      shell: bash
      run: echo "key=$(bash scripts/ffmpeg-deps-key.sh linux-x64)" >> "$GITHUB_OUTPUT"
    - if: env.REUSE != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ffmpeg-deps
        # No restore-keys on purpose: a partially matching prefix (stale headers
        # next to fresh .pc files) is worse than a cold build. The key hashes
        # the build script, the toolchain and the dependency versions, so any
        # dependency bump forces a full rebuild while unrelated workflow edits
        # keep the cache.
        key: ${{ steps.ffmpeg-deps-key.outputs.key }}
    - name: Build (Alpine, fully static against musl)
      if: env.REUSE != 'true'
      shell: bash
      run: |
        # Deliberately `docker run` rather than a job-level `container:` -- the
        # Actions runner injects a glibc-built node for JS actions, which cannot
        # run on musl. This way only the build itself happens inside Alpine.
        image="$(bash scripts/docker-pull.sh "$ALPINE_IMAGE")"
        docker run --rm \
          -v "$PWD:/work" -w /work \
          -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
          -e FFMPEG_VERSION -e ZLIB_VERSION -e BROTLI_VERSION -e HWY_VERSION \
          -e JXL_VERSION -e WEBP_VERSION -e OPUS_VERSION -e LIBVPX_VERSION \
          -e AOM_VERSION -e SVT_AV1_VERSION -e DAV1D_VERSION -e X265_VERSION -e X264_COMMIT \
          -e KVAZAAR_VERSION \
          "$image" sh -euc '
            # Alpine has no "ninja" package, and its "meson" hard-depends on
            # samurai, which conflicts with real ninja -- hence pip for meson.
            apk add --no-cache build-base clang libstdc++-dev cmake ninja-build ninja-is-really-ninja \
              py3-pip python3 nasm yasm git curl bash perl pkgconf linux-headers xz \
              diffutils coreutils tar file
            pip install --break-system-packages --quiet meson
            # apk needs root, so everything written to /work is root-owned, which
            # breaks actions/cache save and the post-job workspace cleanup. Run
            # the chown from a trap so a failed build still leaves a usable tree.
            trap "chown -R $HOST_UID:$HOST_GID /work || true" EXIT
            bash scripts/build-ffmpeg.sh linux-x64
            bash scripts/verify-ffmpeg.sh linux-x64 all
          '
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-ffmpeg-linux
        if-no-files-found: error
        retention-days: 1
        path: |
           ffmpeg-linux-x64
           ffprobe-linux-x64
           x265-linux-x64
           kvazaar-linux-x64

  ffmpeg-linux-arm64:
    needs: [build-plan]
    runs-on: ${{ fromJSON(needs.build-plan.outputs.reuse)['binaries-ffmpeg-linux-arm64'] && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    env:
      REUSE: ${{ fromJSON(needs.build-plan.outputs.reuse)['binaries-ffmpeg-linux-arm64'] }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Download the binaries of the previous release
      if: env.REUSE == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: ./scripts/Get-ReleaseFiles.ps1 -Tag "${{ needs.build-plan.outputs.release }}" -Artifact binaries-ffmpeg-linux-arm64
    - id: ffmpeg-deps-key
      if: env.REUSE != 'true'
      shell: bash
      run: echo "key=$(bash scripts/ffmpeg-deps-key.sh linux-arm64)" >> "$GITHUB_OUTPUT"
    - if: env.REUSE != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ffmpeg-deps
        # No restore-keys on purpose: a partially matching prefix (stale headers
        # next to fresh .pc files) is worse than a cold build. The key hashes
        # the build script, the toolchain and the dependency versions, so any
        # dependency bump forces a full rebuild while unrelated workflow edits
        # keep the cache.
        key: ${{ steps.ffmpeg-deps-key.outputs.key }}
    - name: Build (Alpine, fully static against musl)
      if: env.REUSE != 'true'
      shell: bash
      run: |
        # Deliberately `docker run` rather than a job-level `container:` -- the
        # Actions runner injects a glibc-built node for JS actions, which cannot
        # run on musl. This way only the build itself happens inside Alpine.
        image="$(bash scripts/docker-pull.sh "$ALPINE_IMAGE")"
        docker run --rm \
          -v "$PWD:/work" -w /work \
          -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
          -e FFMPEG_VERSION -e ZLIB_VERSION -e BROTLI_VERSION -e HWY_VERSION \
          -e JXL_VERSION -e WEBP_VERSION -e OPUS_VERSION -e LIBVPX_VERSION \
          -e AOM_VERSION -e SVT_AV1_VERSION -e DAV1D_VERSION -e X265_VERSION -e X264_COMMIT \
          -e KVAZAAR_VERSION \
          "$image" sh -euc '
            # Alpine has no "ninja" package, and its "meson" hard-depends on
            # samurai, which conflicts with real ninja -- hence pip for meson.
            apk add --no-cache build-base clang libstdc++-dev cmake ninja-build ninja-is-really-ninja \
              py3-pip python3 nasm yasm git curl bash perl pkgconf linux-headers xz \
              diffutils coreutils tar file
            pip install --break-system-packages --quiet meson
            # apk needs root, so everything written to /work is root-owned, which
            # breaks actions/cache save and the post-job workspace cleanup. Run
            # the chown from a trap so a failed build still leaves a usable tree.
            trap "chown -R $HOST_UID:$HOST_GID /work || true" EXIT
            bash scripts/build-ffmpeg.sh linux-arm64
            bash scripts/verify-ffmpeg.sh linux-arm64 all
          '
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-ffmpeg-linux-arm64
        if-no-files-found: error
        retention-days: 1
        path: |
           ffmpeg-linux-arm64
           ffprobe-linux-arm64
           x265-linux-arm64
           kvazaar-linux-arm64

  ffmpeg-windows:
    needs: [build-plan]
    runs-on: ubuntu-latest
    env:
      REUSE: ${{ fromJSON(needs.build-plan.outputs.reuse)['binaries-ffmpeg-windows'] }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Download the binaries of the previous release
      if: env.REUSE == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: ./scripts/Get-ReleaseFiles.ps1 -Tag "${{ needs.build-plan.outputs.release }}" -Artifact binaries-ffmpeg-windows
    - name: Install build tools
      if: env.REUSE != 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential cmake ninja-build meson nasm yasm pkgconf git curl xz-utils file
    - name: Install llvm-mingw
      if: env.REUSE != 'true'
      shell: bash
      run: |
        uri="https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/llvm-mingw-$LLVM_MINGW_VERSION-ucrt-ubuntu-22.04-x86_64.tar.xz"
        for attempt in 1 2 3 4 5; do
          if curl -fsSL "$uri" -o llvm-mingw.tar.xz && tar -tJf llvm-mingw.tar.xz > /dev/null 2>&1; then
            break
          fi
          if [ "$attempt" -eq 5 ]; then echo "failed to download llvm-mingw" >&2; exit 1; fi
          sleep $((2 * attempt))
        done
        mkdir -p "$HOME/llvm-mingw"
        tar -xJf llvm-mingw.tar.xz -C "$HOME/llvm-mingw" --strip-components=1
        echo "LLVM_MINGW_ROOT=$HOME/llvm-mingw" >> "$GITHUB_ENV"
        echo "$HOME/llvm-mingw/bin" >> "$GITHUB_PATH"
    - id: ffmpeg-deps-key
      if: env.REUSE != 'true'
      shell: bash
      run: echo "key=$(bash scripts/ffmpeg-deps-key.sh win-x64)" >> "$GITHUB_OUTPUT"
    - if: env.REUSE != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ffmpeg-deps
        key: ${{ steps.ffmpeg-deps-key.outputs.key }}
    - name: Cross-compile for Windows x64
      if: env.REUSE != 'true'
      shell: bash
      run: bash scripts/build-ffmpeg.sh win-x64
    - name: Verify static linkage
      if: env.REUSE != 'true'
      shell: bash
      # Cross-compiled, so it cannot be executed here; the functional smoke
      # tests run in ffmpeg-windows-test on a real Windows runner.
      run: bash scripts/verify-ffmpeg.sh win-x64 link
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-ffmpeg-windows
        if-no-files-found: error
        retention-days: 1
        path: |
           ffmpeg-win-x64.exe
           ffprobe-win-x64.exe
           x265-win-x64.exe
           kvazaar-win-x64.exe

  ffmpeg-windows-arm64:
    needs: [build-plan]
    runs-on: ubuntu-latest
    env:
      REUSE: ${{ fromJSON(needs.build-plan.outputs.reuse)['binaries-ffmpeg-windows-arm64'] }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Download the binaries of the previous release
      if: env.REUSE == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: ./scripts/Get-ReleaseFiles.ps1 -Tag "${{ needs.build-plan.outputs.release }}" -Artifact binaries-ffmpeg-windows-arm64
    - name: Install build tools
      if: env.REUSE != 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential cmake ninja-build meson nasm yasm pkgconf git curl xz-utils file
    - name: Install llvm-mingw
      if: env.REUSE != 'true'
      shell: bash
      run: |
        uri="https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/llvm-mingw-$LLVM_MINGW_VERSION-ucrt-ubuntu-22.04-x86_64.tar.xz"
        for attempt in 1 2 3 4 5; do
          if curl -fsSL "$uri" -o llvm-mingw.tar.xz && tar -tJf llvm-mingw.tar.xz > /dev/null 2>&1; then
            break
          fi
          if [ "$attempt" -eq 5 ]; then echo "failed to download llvm-mingw" >&2; exit 1; fi
          sleep $((2 * attempt))
        done
        mkdir -p "$HOME/llvm-mingw"
        tar -xJf llvm-mingw.tar.xz -C "$HOME/llvm-mingw" --strip-components=1
        echo "LLVM_MINGW_ROOT=$HOME/llvm-mingw" >> "$GITHUB_ENV"
        echo "$HOME/llvm-mingw/bin" >> "$GITHUB_PATH"
    - id: ffmpeg-deps-key
      if: env.REUSE != 'true'
      shell: bash
      run: echo "key=$(bash scripts/ffmpeg-deps-key.sh win-arm64)" >> "$GITHUB_OUTPUT"
    - if: env.REUSE != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ffmpeg-deps
        key: ${{ steps.ffmpeg-deps-key.outputs.key }}
    - name: Cross-compile for Windows arm64
      if: env.REUSE != 'true'
      shell: bash
      run: bash scripts/build-ffmpeg.sh win-arm64
    - name: Verify static linkage
      if: env.REUSE != 'true'
      shell: bash
      # Cross-compiled, so it cannot be executed here; the functional smoke
      # tests run in ffmpeg-windows-arm64-test on a real Windows runner.
      run: bash scripts/verify-ffmpeg.sh win-arm64 link
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-ffmpeg-windows-arm64
        if-no-files-found: error
        retention-days: 1
        path: |
           ffmpeg-win-arm64.exe
           ffprobe-win-arm64.exe
           x265-win-arm64.exe
           kvazaar-win-arm64.exe

  ffmpeg-windows-test:
    runs-on: ${{ fromJSON(needs.build-plan.outputs.reuse)['ffmpeg-windows-test'] && 'ubuntu-latest' || 'windows-latest' }}
    needs: [build-plan, ffmpeg-windows]
    env:
      REUSE: ${{ fromJSON(needs.build-plan.outputs.reuse)['ffmpeg-windows-test'] }}
    steps:
    - if: env.REUSE != 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - if: env.REUSE != 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: binaries-ffmpeg-windows
        path: .
    - name: Smoke test
      if: env.REUSE != 'true'
      shell: bash
      run: bash scripts/verify-ffmpeg.sh win-x64 run

  ffmpeg-windows-arm64-test:
    runs-on: ${{ fromJSON(needs.build-plan.outputs.reuse)['ffmpeg-windows-arm64-test'] && 'ubuntu-latest' || 'windows-11-arm' }}
    needs: [build-plan, ffmpeg-windows-arm64]
    env:
      REUSE: ${{ fromJSON(needs.build-plan.outputs.reuse)['ffmpeg-windows-arm64-test'] }}
    steps:
    - if: env.REUSE != 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - if: env.REUSE != 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: binaries-ffmpeg-windows-arm64
        path: .
    - name: Smoke test
      if: env.REUSE != 'true'
      shell: bash
      run: bash scripts/verify-ffmpeg.sh win-arm64 run

  ffmpeg-osx-arm64:
    needs: [build-plan]
    runs-on: ${{ fromJSON(needs.build-plan.outputs.reuse)['binaries-ffmpeg-osx-arm64'] && 'ubuntu-latest' || 'macos-latest' }}
    env:
      REUSE: ${{ fromJSON(needs.build-plan.outputs.reuse)['binaries-ffmpeg-osx-arm64'] }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Download the binaries of the previous release
      if: env.REUSE == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: ./scripts/Get-ReleaseFiles.ps1 -Tag "${{ needs.build-plan.outputs.release }}" -Artifact binaries-ffmpeg-osx-arm64
    - if: env.REUSE != 'true'
      run: brew install pkgconf cmake ninja meson nasm
      shell: bash
    - id: ffmpeg-deps-key
      if: env.REUSE != 'true'
      shell: bash
      run: echo "key=$(bash scripts/ffmpeg-deps-key.sh osx-arm64)" >> "$GITHUB_OUTPUT"
    - if: env.REUSE != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ffmpeg-deps
        key: ${{ steps.ffmpeg-deps-key.outputs.key }}
    - name: Build
      if: env.REUSE != 'true'
      shell: bash
      # macOS has no static libSystem, so this cannot be fully static; the bar
      # is "no non-system dylibs", which verify-ffmpeg.sh asserts with otool -L.
      run: bash scripts/build-ffmpeg.sh osx-arm64
    - name: Verify and smoke test
      if: env.REUSE != 'true'
      shell: bash
      run: bash scripts/verify-ffmpeg.sh osx-arm64 all
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-ffmpeg-osx-arm64
        if-no-files-found: error
        retention-days: 1
        path: |
           ffmpeg-osx-arm64
           ffprobe-osx-arm64
           x265-osx-arm64
           kvazaar-osx-arm64
