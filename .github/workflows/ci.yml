      shell: bash
      run: bash scripts/verify-ffmpeg.sh win-arm64 run

  ffmpeg-custom-osx-arm64:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - run: brew install pkgconf cmake ninja meson nasm
      shell: bash
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ffmpeg-deps
        key: ffmpeg-deps-v1-osx-arm64-${{ hashFiles('scripts/build-ffmpeg.sh', '.github/workflows/ci.yml') }}
    - name: Build
      shell: bash
      # macOS has no static libSystem, so this cannot be fully static; the bar
      # is "no non-system dylibs", which verify-ffmpeg.sh asserts with otool -L.
      run: bash scripts/build-ffmpeg.sh osx-arm64
    - name: Verify and smoke test
      shell: bash
      run: bash scripts/verify-ffmpeg.sh osx-arm64 all
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-ffmpeg-custom-osx-arm64
        if-no-files-found: error
        retention-days: 1
        path: |
           ffmpeg-custom-osx-arm64
           ffprobe-custom-osx-arm64

  prebuilt-docker-linux-x64:
    runs-on: ubuntu-latest
    needs: [zopfli-linux, oxipng-linux, pngout-linux, ffmpeg-linux, ffmpeg-custom-linux]
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: binaries-zopfli-linux
        path: .
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: binaries-oxipng-linux
        path: .
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: binaries-pngout-linux
        path: .
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: binaries-ffmpeg-linux
        path: .
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: binaries-ffmpeg-custom-linux
        path: .
    - run: |
       @"
       FROM ubuntu:24.04
       COPY --chmod=0755 zopfli-linux-x64 /usr/local/bin/zopfli
       COPY --chmod=0755 oxipng-linux-x64 /usr/local/bin/oxipng
       COPY --chmod=0755 pngout-linux-x64 /usr/local/bin/pngout
       COPY --chmod=0755 ffmpeg-linux-x64 /usr/local/bin/ffmpeg
       COPY --chmod=0755 ffprobe-linux-x64 /usr/local/bin/ffprobe
       COPY --chmod=0755 ffmpeg-custom-linux-x64 /usr/local/bin/ffmpeg-custom
       COPY --chmod=0755 ffprobe-custom-linux-x64 /usr/local/bin/ffprobe-custom
       "@ | Set-Content -LiteralPath Dockerfile -NoNewline
    - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
    - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64
        push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        tags: ghcr.io/${{ github.repository_owner }}/prebuilt:${{ env.VERSION }}-linux-x64

  prebuilt-docker-linux-arm64:
    runs-on: ubuntu-latest
    needs: [zopfli-linux-arm64, oxipng-linux-arm64, pngout-linux-arm64, ffmpeg-linux-arm64, ffmpeg-custom-linux-arm64]
