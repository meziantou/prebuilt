          -v "$PWD:/work" -w /work \
          -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
          -e POPPLER_VERSION -e ZLIB_VERSION -e LIBJPEG_TURBO_VERSION -e LIBPNG_VERSION -e BROTLI_VERSION \
          -e FREETYPE_VERSION -e LCMS2_VERSION -e OPENJPEG_VERSION -e NSS_VERSION -e NSPR_VERSION \
          "$image" sh -euc '
            apk add --no-cache build-base clang libstdc++-dev cmake ninja-build ninja-is-really-ninja \
              py3-pip python3 git curl bash perl pkgconf linux-headers tar xz
            pip install --break-system-packages --quiet gyp-next
            # Everything written to /work is root-owned; hand it back to the
            # runner user so the next steps and the post-job cleanup work.
            trap "chown -R $HOST_UID:$HOST_GID /work || true" EXIT
            bash scripts/build-poppler.sh ${{ matrix.rid }}
          '
    - name: Install build tools
      if: env.REUSE != 'true' && matrix.rid == 'win-x64'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential cmake ninja-build pkgconf git curl xz-utils file
    - name: Install llvm-mingw
      if: env.REUSE != 'true' && matrix.rid == 'win-x64'
      shell: bash
      run: |
        uri="https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/llvm-mingw-$LLVM_MINGW_VERSION-ucrt-ubuntu-22.04-x86_64.tar.xz"
        for attempt in 1 2 3 4 5; do
          if curl -fsSL "$uri" -o llvm-mingw.tar.xz && tar -tJf llvm-mingw.tar.xz > /dev/null 2>&1; then
            break
          fi
          if [ "$attempt" -eq 5 ]; then echo "failed to download llvm-mingw" >&2; exit 1; fi
          sleep $((2 * attempt))
        done
        mkdir -p "$HOME/llvm-mingw"
        tar -xJf llvm-mingw.tar.xz -C "$HOME/llvm-mingw" --strip-components=1
        echo "LLVM_MINGW_ROOT=$HOME/llvm-mingw" >> "$GITHUB_ENV"
        echo "$HOME/llvm-mingw/bin" >> "$GITHUB_PATH"
    - name: Cross-compile for Windows x64
      if: env.REUSE != 'true' && matrix.rid == 'win-x64'
      shell: bash
      run: bash scripts/build-poppler.sh win-x64
    - name: Build (macOS)
      if: env.REUSE != 'true' && matrix.rid == 'osx-arm64'
      shell: bash
      # macOS has no static libSystem, so this cannot be fully static; the bar
      # is "no non-system dylibs", which verify-poppler.sh asserts with otool -L.
      run: |
        brew install pkgconf cmake ninja
        pipx install gyp-next
        bash scripts/build-poppler.sh osx-arm64
    - name: Verify and smoke test
      if: env.REUSE != 'true'
      shell: bash
      # On the runner itself: for Linux this also checks that the musl binaries
      # run outside of Alpine. The Windows binaries are cross-compiled, so they
      # cannot be executed here; poppler-windows-test runs their smoke tests.
      # The signature test signs a file with the openssl of the runner.
      run: bash scripts/verify-poppler.sh ${{ matrix.rid }} ${{ matrix.rid == 'win-x64' && 'link' || 'all' }}
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-poppler-${{ matrix.rid }}
        if-no-files-found: error
        retention-days: 1
        path: |
           pdftoppm-${{ matrix.rid }}*
           pdftotext-${{ matrix.rid }}*
           pdffonts-${{ matrix.rid }}*
           pdfinfo-${{ matrix.rid }}*
           pdfsig-${{ matrix.rid }}*

  poppler-windows-test:
    runs-on: ${{ fromJSON(needs.build-plan.outputs.reuse)['poppler-windows-test'] && 'ubuntu-latest' || 'windows-latest' }}
    needs: [build-plan, poppler]
    env:
      REUSE: ${{ fromJSON(needs.build-plan.outputs.reuse)['poppler-windows-test'] }}
    steps:
    - if: env.REUSE != 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - if: env.REUSE != 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: binaries-poppler-win-x64
        path: .
    - name: Smoke test
      if: env.REUSE != 'true'
      shell: bash
      run: bash scripts/verify-poppler.sh win-x64 run

  # veraPDF, the PDF/A and PDF/UA validator, with a Java runtime cut with
  # jlink from Eclipse Temurin (scripts/build-verapdf.sh): verapdf-<rid>.tar.gz.
  # Every target is linked natively, on its own runner, but win-x64, linked on
  # Linux from the jmods of the Windows JDK, whose launcher
  # (scripts/verapdf-launcher.c) is cross-compiled with llvm-mingw. The Linux
  # runtimes are Temurin's, which need glibc: no Alpine container.
  # No Windows arm64 build, as for the image tools.
  verapdf:
    needs: [build-plan]
    strategy:
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: win-x64
            os: ubuntu-latest
          - rid: osx-arm64
            os: macos-latest
    runs-on: ${{ fromJSON(needs.build-plan.outputs.reuse)[format('binaries-verapdf-{0}', matrix.rid)] && 'ubuntu-latest' || matrix.os }}
    env:
      REUSE: ${{ fromJSON(needs.build-plan.outputs.reuse)[format('binaries-verapdf-{0}', matrix.rid)] }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Download the binaries of the previous release
      if: env.REUSE == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: ./scripts/Get-ReleaseFiles.ps1 -Tag "${{ needs.build-plan.outputs.release }}" -Artifact binaries-verapdf-${{ matrix.rid }}
    - name: Install llvm-mingw
      if: env.REUSE != 'true' && matrix.rid == 'win-x64'
      shell: bash
      run: |
        uri="https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/llvm-mingw-$LLVM_MINGW_VERSION-ucrt-ubuntu-22.04-x86_64.tar.xz"
        for attempt in 1 2 3 4 5; do
          if curl -fsSL "$uri" -o llvm-mingw.tar.xz && tar -tJf llvm-mingw.tar.xz > /dev/null 2>&1; then
            break
          fi
          if [ "$attempt" -eq 5 ]; then echo "failed to download llvm-mingw" >&2; exit 1; fi
          sleep $((2 * attempt))
        done
        mkdir -p "$HOME/llvm-mingw"
        tar -xJf llvm-mingw.tar.xz -C "$HOME/llvm-mingw" --strip-components=1
        echo "LLVM_MINGW_ROOT=$HOME/llvm-mingw" >> "$GITHUB_ENV"
        echo "$HOME/llvm-mingw/bin" >> "$GITHUB_PATH"
    - name: Build
      if: env.REUSE != 'true'
      shell: bash
      run: bash scripts/build-verapdf.sh ${{ matrix.rid }}
    - name: Verify and smoke test
      if: env.REUSE != 'true'
      shell: bash
      # On the runner itself. The Windows bundle is linked on Linux, so it
      # cannot be executed here; verapdf-windows-test runs its smoke tests.
      run: bash scripts/verify-verapdf.sh ${{ matrix.rid }} ${{ matrix.rid == 'win-x64' && 'link' || 'all' }}
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-verapdf-${{ matrix.rid }}
        if-no-files-found: error
        retention-days: 1
        path: verapdf-${{ matrix.rid }}.tar.gz

  verapdf-windows-test:
    runs-on: ${{ fromJSON(needs.build-plan.outputs.reuse)['verapdf-windows-test'] && 'ubuntu-latest' || 'windows-latest' }}
    needs: [build-plan, verapdf]
    env:
      REUSE: ${{ fromJSON(needs.build-plan.outputs.reuse)['verapdf-windows-test'] }}
    steps:
    - if: env.REUSE != 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - if: env.REUSE != 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: binaries-verapdf-win-x64
        path: .
    - name: Smoke test
      if: env.REUSE != 'true'
      shell: bash
      run: bash scripts/verify-verapdf.sh win-x64 run

  # pdfium_test, the command-line tool of PDFium, built with the GN/depot_tools
  # build of PDFium from a chromium/<N> branch, configured as the PDFium pixel
  # tests are run, and bundled with their fonts (scripts/build-pdfium.sh):
  # pdfium_test-<rid>.tar.gz. Chromium's toolchain needs glibc, and ships its
  # clang for x64 Linux machines only: linux-arm64 is cross-compiled on
  # ubuntu-latest, and pdfium-linux-arm64-test runs it. win-x64 is built on
  # Windows (Visual Studio and the Windows SDK), osx-arm64 on macOS.
  # No Windows arm64 build, as for the image tools.
  pdfium:
    needs: [build-plan]
    strategy:
      # Each build takes long: a failure on one target does not cancel the others.
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-latest
          - rid: win-x64
            os: windows-latest
          - rid: osx-arm64
            os: macos-latest
    runs-on: ${{ fromJSON(needs.build-plan.outputs.reuse)[format('binaries-pdfium-{0}', matrix.rid)] && 'ubuntu-latest' || matrix.os }}
    env:
      REUSE: ${{ fromJSON(needs.build-plan.outputs.reuse)[format('binaries-pdfium-{0}', matrix.rid)] }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Download the binaries of the previous release
      if: env.REUSE == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: ./scripts/Get-ReleaseFiles.ps1 -Tag "${{ needs.build-plan.outputs.release }}" -Artifact binaries-pdfium-${{ matrix.rid }}
    - name: Free disk space
      if: env.REUSE != 'true' && startsWith(matrix.rid, 'linux-')
      shell: bash
      # The PDFium checkout and build take more than the free space of the runner.
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h "$GITHUB_WORKSPACE"
    - name: Install the Windows SDK
      if: env.REUSE != 'true' && matrix.rid == 'win-x64'
      shell: bash
      # The SDK version the Chromium toolchain of the branch asks for, as
      # bblanchon/pdfium-binaries installs it.
      run: |
        sdk_version="10.0.28000.0"
        if [ ! -d "/c/Program Files (x86)/Windows Kits/10/bin/$sdk_version/x64" ]; then
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/winsdksetup.exe" "https://go.microsoft.com/fwlink/?linkid=2370315"
          MSYS2_ARG_CONV_EXCL="*" "$RUNNER_TEMP/winsdksetup.exe" /features OptionId.DesktopCPPx64 /ceip off /quiet /norestart
        fi
        echo "/c/Program Files (x86)/Windows Kits/10/bin/$sdk_version/x64" >> "$GITHUB_PATH"
    - name: Build
      if: env.REUSE != 'true'
      shell: bash
      run: bash scripts/build-pdfium.sh ${{ matrix.rid }}
    - name: Verify and smoke test
      if: env.REUSE != 'true'
      shell: bash
      # On the runner itself, but linux-arm64, cross-compiled:
      # pdfium-linux-arm64-test runs its smoke tests.
      run: bash scripts/verify-pdfium.sh ${{ matrix.rid }} ${{ matrix.rid == 'linux-arm64' && 'link' || 'all' }}
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-pdfium-${{ matrix.rid }}
        if-no-files-found: error
        retention-days: 1
        path: pdfium_test-${{ matrix.rid }}.tar.gz

  pdfium-linux-arm64-test:
    runs-on: ${{ fromJSON(needs.build-plan.outputs.reuse)['pdfium-linux-arm64-test'] && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    needs: [build-plan, pdfium]
    env:
      REUSE: ${{ fromJSON(needs.build-plan.outputs.reuse)['pdfium-linux-arm64-test'] }}
    steps:
    - if: env.REUSE != 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - if: env.REUSE != 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: binaries-pdfium-linux-arm64
        path: .
    - name: Smoke test
      if: env.REUSE != 'true'
      shell: bash
      run: bash scripts/verify-pdfium.sh linux-arm64 run

  # dec265 (libde265) and heif-enc, heif-dec and heif-info (libheif), for HEVC
  # only: x265 encodes, for 8, 10 and 12 bits, and libde265 decodes. Every
  # target is built from the sources (scripts/build-libheif.sh): neither
  # project publishes binaries, and the point of these builds is a known set of
  # codecs. x265 is the version ffmpeg is built with, built the same way
  # (scripts/x265-multilib.sh); zlib and libpng are the versions of the libjxl
  # tools.
  # No Windows arm64 build, as for the other image tools.
  libheif:
    needs: [build-plan]
    strategy:
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: win-x64
            os: ubuntu-latest
          - rid: osx-arm64
            os: macos-latest
    runs-on: ${{ fromJSON(needs.build-plan.outputs.reuse)[format('binaries-libheif-{0}', matrix.rid)] && 'ubuntu-latest' || matrix.os }}
    env:
      REUSE: ${{ fromJSON(needs.build-plan.outputs.reuse)[format('binaries-libheif-{0}', matrix.rid)] }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Download the binaries of the previous release
      if: env.REUSE == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: ./scripts/Get-ReleaseFiles.ps1 -Tag "${{ needs.build-plan.outputs.release }}" -Artifact binaries-libheif-${{ matrix.rid }}
    - name: Build (Alpine, fully static against musl)
      if: env.REUSE != 'true' && startsWith(matrix.rid, 'linux-')
      shell: bash
      run: |
        # `docker run` rather than a job-level `container:`, as for ffmpeg-linux.
        image="$(bash scripts/docker-pull.sh "$ALPINE_IMAGE")"
        docker run --rm \
          -v "$PWD:/work" -w /work \
          -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
          -e ZLIB_VERSION -e LIBPNG_VERSION -e X265_VERSION -e LIBDE265_VERSION -e LIBHEIF_VERSION \
          "$image" sh -euc '
            apk add --no-cache build-base clang libstdc++-dev cmake ninja-build ninja-is-really-ninja \
              nasm git curl bash perl pkgconf linux-headers tar
            # Everything written to /work is root-owned; hand it back to the
            # runner user so the next steps and the post-job cleanup work.
            trap "chown -R $HOST_UID:$HOST_GID /work || true" EXIT
            bash scripts/build-libheif.sh ${{ matrix.rid }}
          '
    - name: Install build tools
      if: env.REUSE != 'true' && matrix.rid == 'win-x64'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential cmake ninja-build nasm pkgconf git curl xz-utils file
    - name: Install llvm-mingw
      if: env.REUSE != 'true' && matrix.rid == 'win-x64'
      shell: bash
      run: |
        uri="https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/llvm-mingw-$LLVM_MINGW_VERSION-ucrt-ubuntu-22.04-x86_64.tar.xz"
        for attempt in 1 2 3 4 5; do
          if curl -fsSL "$uri" -o llvm-mingw.tar.xz && tar -tJf llvm-mingw.tar.xz > /dev/null 2>&1; then
            break
          fi
          if [ "$attempt" -eq 5 ]; then echo "failed to download llvm-mingw" >&2; exit 1; fi
          sleep $((2 * attempt))
        done
        mkdir -p "$HOME/llvm-mingw"
        tar -xJf llvm-mingw.tar.xz -C "$HOME/llvm-mingw" --strip-components=1
        echo "LLVM_MINGW_ROOT=$HOME/llvm-mingw" >> "$GITHUB_ENV"
        echo "$HOME/llvm-mingw/bin" >> "$GITHUB_PATH"
    - name: Cross-compile for Windows x64
      if: env.REUSE != 'true' && matrix.rid == 'win-x64'
      shell: bash
      run: bash scripts/build-libheif.sh win-x64
    - name: Build (macOS)
      if: env.REUSE != 'true' && matrix.rid == 'osx-arm64'
      shell: bash
      # macOS has no static libSystem, so this cannot be fully static; the bar
      # is "no non-system dylibs", which verify-libheif.sh asserts with otool -L.
      run: |
        brew install pkgconf cmake ninja
        bash scripts/build-libheif.sh osx-arm64
    - name: Verify and smoke test
      if: env.REUSE != 'true'
      shell: bash
      # On the runner itself: for Linux this also checks that the musl binaries
      # run outside of Alpine. The Windows binaries are cross-compiled, so they
      # cannot be executed here; libheif-windows-test runs their smoke tests.
      run: bash scripts/verify-libheif.sh ${{ matrix.rid }} ${{ matrix.rid == 'win-x64' && 'link' || 'all' }}
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-libheif-${{ matrix.rid }}
        if-no-files-found: error
        retention-days: 1
        path: |
           dec265-${{ matrix.rid }}*
           heif-enc-${{ matrix.rid }}*
           heif-dec-${{ matrix.rid }}*
           heif-info-${{ matrix.rid }}*

  libheif-windows-test:
    runs-on: ${{ fromJSON(needs.build-plan.outputs.reuse)['libheif-windows-test'] && 'ubuntu-latest' || 'windows-latest' }}
    needs: [build-plan, libheif]
    env:
      REUSE: ${{ fromJSON(needs.build-plan.outputs.reuse)['libheif-windows-test'] }}
    steps:
    - if: env.REUSE != 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - if: env.REUSE != 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: binaries-libheif-win-x64
        path: .
    - name: Smoke test
      if: env.REUSE != 'true'
      shell: bash
      run: bash scripts/verify-libheif.sh win-x64 run

  # TAppEncoder and TAppDecoder, the encoder and the decoder of HM, the HEVC
  # reference software, built with its high bit depth support
  # (scripts/build-hm.sh). HM publishes no binaries.
  # No Windows arm64 build, as for the other image tools.
