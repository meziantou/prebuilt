  # from a commit of its master branch (scripts/build-iso-jpeg.sh). It has no
  # dependency.
  # No Windows arm64 build, as for the other image tools.
  iso-jpeg:
    needs: [build-plan]
    strategy:
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: win-x64
            os: ubuntu-latest
          - rid: osx-arm64
            os: macos-latest
    runs-on: ${{ fromJSON(needs.build-plan.outputs.reuse)[format('binaries-iso-jpeg-{0}', matrix.rid)] && 'ubuntu-latest' || matrix.os }}
    env:
      REUSE: ${{ fromJSON(needs.build-plan.outputs.reuse)[format('binaries-iso-jpeg-{0}', matrix.rid)] }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Download the binaries of the previous release
      if: env.REUSE == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: ./scripts/Get-ReleaseFiles.ps1 -Tag "${{ needs.build-plan.outputs.release }}" -Artifact binaries-iso-jpeg-${{ matrix.rid }}
    - name: Build (Alpine, fully static against musl)
      if: env.REUSE != 'true' && startsWith(matrix.rid, 'linux-')
      shell: bash
      run: |
        # `docker run` rather than a job-level `container:`, as for ffmpeg-linux.
        image="$(bash scripts/docker-pull.sh "$ALPINE_IMAGE")"
        docker run --rm \
          -v "$PWD:/work" -w /work \
          -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
          -e ISO_JPEG_COMMIT -e ISO_JPEG_VERSION \
          "$image" sh -euc '
            apk add --no-cache build-base clang libstdc++-dev curl bash tar
            # Everything written to /work is root-owned; hand it back to the
            # runner user so the next steps and the post-job cleanup work.
            trap "chown -R $HOST_UID:$HOST_GID /work || true" EXIT
            bash scripts/build-iso-jpeg.sh ${{ matrix.rid }}
          '
    - name: Install build tools
      if: env.REUSE != 'true' && matrix.rid == 'win-x64'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential curl xz-utils file
    - name: Install llvm-mingw
      if: env.REUSE != 'true' && matrix.rid == 'win-x64'
      shell: bash
      run: |
        uri="https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/llvm-mingw-$LLVM_MINGW_VERSION-ucrt-ubuntu-22.04-x86_64.tar.xz"
        for attempt in 1 2 3 4 5; do
          if curl -fsSL "$uri" -o llvm-mingw.tar.xz && tar -tJf llvm-mingw.tar.xz > /dev/null 2>&1; then
            break
          fi
          if [ "$attempt" -eq 5 ]; then echo "failed to download llvm-mingw" >&2; exit 1; fi
          sleep $((2 * attempt))
        done
        mkdir -p "$HOME/llvm-mingw"
        tar -xJf llvm-mingw.tar.xz -C "$HOME/llvm-mingw" --strip-components=1
        echo "LLVM_MINGW_ROOT=$HOME/llvm-mingw" >> "$GITHUB_ENV"
        echo "$HOME/llvm-mingw/bin" >> "$GITHUB_PATH"
    - name: Cross-compile for Windows x64
      if: env.REUSE != 'true' && matrix.rid == 'win-x64'
      shell: bash
      run: bash scripts/build-iso-jpeg.sh win-x64
    - name: Build (macOS)
      if: env.REUSE != 'true' && matrix.rid == 'osx-arm64'
      shell: bash
      # macOS has no static libSystem, so this cannot be fully static; the bar
      # is "no non-system dylibs", which verify-iso-jpeg.sh asserts with otool -L.
      # make and clang are the ones of the runner.
      run: bash scripts/build-iso-jpeg.sh osx-arm64
    - name: Verify and smoke test
      if: env.REUSE != 'true'
      shell: bash
      # On the runner itself: for Linux this also checks that the musl binary
      # runs outside of Alpine. The Windows binary is cross-compiled, so it
      # cannot be executed here; iso-jpeg-windows-test runs its smoke tests.
      run: bash scripts/verify-iso-jpeg.sh ${{ matrix.rid }} ${{ matrix.rid == 'win-x64' && 'link' || 'all' }}
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-iso-jpeg-${{ matrix.rid }}
        if-no-files-found: error
