name: Build
on:
  push:
    branches:
      - 'main'
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

env:
  VERSION: 2.1.0
  PNGOUT_VERSION: 1.0.0 # http://advsys.net/ken/utils.htm#pngout - manual version
  ZOPFLI_VERSION: "1.0.3" # https://github.com/google/zopfli/tags
  OXIPNG_VERSION: "10.2.0" # https://github.com/shssoichiro/oxipng/releases
  FFMPEG_VERSION: "9.0" # https://github.com/BtbN/FFmpeg-Builds/releases
  # Custom statically linked FFmpeg build -> ffmpeg-custom-* / ffprobe-custom-*
  FFMPEG_CUSTOM_VERSION: "9.0.1" # https://github.com/FFmpeg/FFmpeg/tags - built from tag n<version>
  LLVM_MINGW_VERSION: "20260826" # https://github.com/mstorsjo/llvm-mingw/releases
  # Alpine 3.23 ships CMake 4, which several of the dependencies below reject.
  ALPINE_IMAGE: "alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce"
  ZLIB_VERSION: "1.3.2" # https://github.com/madler/zlib/tags
  BROTLI_VERSION: "1.2.0" # https://github.com/google/brotli/tags
  HWY_VERSION: "1.4.0" # https://github.com/google/highway/tags - tags have no leading v
  JXL_VERSION: "0.11.2" # https://github.com/libjxl/libjxl/releases - pinned; 0.12 changed skcms/CMS handling
  WEBP_VERSION: "1.6.0" # https://github.com/webmproject/libwebp/tags
  OPUS_VERSION: "1.5.2" # https://github.com/xiph/opus/releases - releases only; v1.6.x tags ship no tarball
  LIBVPX_VERSION: "1.17.0" # https://github.com/webmproject/libvpx/tags
  AOM_VERSION: "3.15.0" # https://aomedia.googlesource.com/aom
  SVT_AV1_VERSION: "4.2.0" # https://gitlab.com/AOMediaCodec/SVT-AV1/-/tags
  DAV1D_VERSION: "1.5.4" # https://code.videolan.org/videolan/dav1d/-/tags
  X265_VERSION: "4.2" # https://bitbucket.org/multicoreware/x265_git/downloads/?tab=tags
  X264_COMMIT: "b35605ace3ddf7c1a5d67a2eb553f034aef41d55" # https://code.videolan.org/videolan/x264 - stable branch

jobs:
  create-release:
    runs-on: ubuntu-latest
    needs: [
      versions_json,
      zopfli-linux,
      zopfli-linux-arm64,
      zopfli-windows,
      zopfli-osx-arm64,
      oxipng-linux,
      oxipng-linux-arm64,
      oxipng-windows,
      oxipng-osx-arm64,
      ffmpeg-linux,
      ffmpeg-linux-arm64,
      ffmpeg-windows,
      ffmpeg-windows-arm64,
      ffmpeg-custom-linux,
      ffmpeg-custom-linux-arm64,
      ffmpeg-custom-windows,
      ffmpeg-custom-windows-arm64,
      ffmpeg-custom-windows-test,
      ffmpeg-custom-windows-arm64-test,
      ffmpeg-custom-osx-arm64,
      pngout-linux,
      pngout-linux-arm64,
      pngout-windows,
      pngout-osx-arm64
    ]
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - id: download_release_artifacts
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        pattern: '*'
        path: binaries
        merge-multiple: true
    - if: steps.download_release_artifacts.outcome == 'failure'
      run: Remove-Item -LiteralPath binaries -Recurse -Force -ErrorAction SilentlyContinue
    - if: steps.download_release_artifacts.outcome == 'failure'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        pattern: '*'
        path: binaries
        merge-multiple: true
    - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: 'gh release create "${{ env.VERSION }}" --target "${{ github.sha }}" ./binaries/*'
      env:
        GH_TOKEN: ${{ github.token }}

  versions_json:
    runs-on: ubuntu-latest
    steps:
    - run: |
        $versions = @{}
        $versions.Zopfli = "${{ env.ZOPFLI_VERSION }}"
        $versions.Oxipng = "${{ env.OXIPNG_VERSION }}"
        $versions.FFmpeg = "${{ env.FFMPEG_VERSION }}"
        $versions.FFmpegCustom = "${{ env.FFMPEG_CUSTOM_VERSION }}"
        $versions.Pngout = "${{ env.PNGOUT_VERSION }}"
        ConvertTo-Json $versions | Out-File versions.json
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-versions
        if-no-files-found: error
        retention-days: 1
        path: 'versions.json'

  zopfli-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: google/zopfli
        ref: zopfli-${{ env.ZOPFLI_VERSION }}
    - run: make zopfli
    - run: |
        mv zopfli zopfli-linux-x64
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-zopfli-linux
        if-no-files-found: error
        retention-days: 1
        path: zopfli-linux-x64

  zopfli-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: google/zopfli
        ref: zopfli-${{ env.ZOPFLI_VERSION }}
    - run: make zopfli
    - run: |
        mv zopfli zopfli-linux-arm64
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-zopfli-linux-arm64
        if-no-files-found: error
        retention-days: 1
        path: zopfli-linux-arm64

  zopfli-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: google/zopfli
        ref: zopfli-${{ env.ZOPFLI_VERSION }}
    - name: Enable Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      with:
        arch: x64
    - run: |
        foreach($item in (Get-ChildItem src\zopfli -Filter *.c -Recurse)) {
          Write-Host "Compiling $item"
          & cl -nologo -O2 /GL /GS- /I$env:CRT_INC_PATH /I. -c /MD /DNDEBUG "$item"
        }

        Write-Host "Linking zopfli.exe"
        & link -nologo /LTCG /OUT:zopfli.exe *.obj user32.lib advapi32.lib kernel32.lib

        Move-Item zopfli.exe zopfli-win-x64.exe
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-zopfli-windows
        if-no-files-found: error
        retention-days: 1
        path: zopfli-win-x64.exe

  zopfli-osx-arm64:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: google/zopfli
        ref: zopfli-${{ env.ZOPFLI_VERSION }}
    - run: make zopfli
    - run: |
        Move-Item zopfli zopfli-osx-arm64
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-zopfli-osx-arm64
        if-no-files-found: error
        retention-days: 1
        path: zopfli-osx-arm64

  oxipng-windows:
    runs-on: ubuntu-latest
    steps:
    - run: |
       $uri = 'https://github.com/shssoichiro/oxipng/releases/download/v${{ env.OXIPNG_VERSION }}/oxipng-${{ env.OXIPNG_VERSION }}-x86_64-pc-windows-msvc.zip'
       $archivePath = "oxipng.zip"
       for ($attempt = 1; $attempt -le 5; $attempt++) {
         try {
           Invoke-WebRequest -Uri $uri -OutFile $archivePath -ErrorAction Stop
         } catch {
           if ($attempt -eq 5) {
             throw
           }
           Start-Sleep -Seconds (2 * $attempt)
           continue
         }
         & unzip -tqq $archivePath *> $null
         if ($LASTEXITCODE -eq 0) {
           break
         }
         if ($attempt -eq 5) {
           throw "Failed to download a valid oxipng archive after $attempt attempts"
         }
         Remove-Item -LiteralPath $archivePath -Force -ErrorAction SilentlyContinue
         Start-Sleep -Seconds (2 * $attempt)
       }
    - run: Expand-Archive oxipng.zip -DestinationPath .
    - run: |
        Get-ChildItem -Path ".\" -Recurse -Filter "oxipng.exe" | Copy-Item -Destination ".\"
        Move-Item oxipng.exe oxipng-win-x64.exe
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-oxipng-windows
        if-no-files-found: error
        retention-days: 1
        path: 'oxipng-win-x64.exe'

  oxipng-linux:
    runs-on: ubuntu-latest
    steps:
    - run: |
       $uri = 'https://github.com/shssoichiro/oxipng/releases/download/v${{ env.OXIPNG_VERSION }}/oxipng-${{ env.OXIPNG_VERSION }}-x86_64-unknown-linux-musl.tar.gz'
       $archivePath = "oxipng.tar.gz"
       for ($attempt = 1; $attempt -le 5; $attempt++) {
         try {
           Invoke-WebRequest -Uri $uri -OutFile $archivePath -ErrorAction Stop
         } catch {
           if ($attempt -eq 5) {
             throw
           }
           Start-Sleep -Seconds (2 * $attempt)
           continue
         }
         & tar -tzf $archivePath *> $null
         if ($LASTEXITCODE -eq 0) {
           break
         }
         if ($attempt -eq 5) {
           throw "Failed to download a valid oxipng archive after $attempt attempts"
         }
         Remove-Item -LiteralPath $archivePath -Force -ErrorAction SilentlyContinue
         Start-Sleep -Seconds (2 * $attempt)
       }
    - run: tar -xvf oxipng.tar.gz
    - run: mv oxipng-*-x86_64-unknown-linux-musl/oxipng oxipng-linux-x64
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-oxipng-linux
        if-no-files-found: error
        retention-days: 1
        path: 'oxipng-linux-x64'

  oxipng-linux-arm64:
    runs-on: ubuntu-latest
    steps:
    - run: |
       $uri = 'https://github.com/shssoichiro/oxipng/releases/download/v${{ env.OXIPNG_VERSION }}/oxipng-${{ env.OXIPNG_VERSION }}-aarch64-unknown-linux-musl.tar.gz'
       $archivePath = "oxipng.tar.gz"
       for ($attempt = 1; $attempt -le 5; $attempt++) {
         try {
           Invoke-WebRequest -Uri $uri -OutFile $archivePath -ErrorAction Stop
         } catch {
           if ($attempt -eq 5) {
             throw
           }
           Start-Sleep -Seconds (2 * $attempt)
           continue
         }
         & tar -tzf $archivePath *> $null
         if ($LASTEXITCODE -eq 0) {
           break
         }
         if ($attempt -eq 5) {
           throw "Failed to download a valid oxipng archive after $attempt attempts"
         }
         Remove-Item -LiteralPath $archivePath -Force -ErrorAction SilentlyContinue
         Start-Sleep -Seconds (2 * $attempt)
       }
    - run: tar -xvf oxipng.tar.gz
    - run: mv oxipng-*-aarch64-unknown-linux-musl/oxipng oxipng-linux-arm64
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-oxipng-linux-arm64
        if-no-files-found: error
        retention-days: 1
        path: 'oxipng-linux-arm64'

  oxipng-osx-arm64:
    runs-on: ubuntu-latest
    steps:
    - run: |
       $uri = 'https://github.com/shssoichiro/oxipng/releases/download/v${{ env.OXIPNG_VERSION }}/oxipng-${{ env.OXIPNG_VERSION }}-aarch64-apple-darwin.tar.gz'
       $archivePath = "oxipng.tar.gz"
       for ($attempt = 1; $attempt -le 5; $attempt++) {
         try {
           Invoke-WebRequest -Uri $uri -OutFile $archivePath -ErrorAction Stop
         } catch {
           if ($attempt -eq 5) {
             throw
           }
           Start-Sleep -Seconds (2 * $attempt)
           continue
         }
         & tar -tzf $archivePath *> $null
         if ($LASTEXITCODE -eq 0) {
           break
         }
         if ($attempt -eq 5) {
           throw "Failed to download a valid oxipng archive after $attempt attempts"
         }
         Remove-Item -LiteralPath $archivePath -Force -ErrorAction SilentlyContinue
         Start-Sleep -Seconds (2 * $attempt)
       }
    - run: tar -xvf oxipng.tar.gz
    - run: mv oxipng-*-aarch64-apple-darwin/oxipng oxipng-osx-arm64
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-oxipng-osx-arm64
        if-no-files-found: error
        retention-days: 1
        path: 'oxipng-osx-arm64'

  pngout-windows:
    runs-on: ubuntu-latest
    steps:
    - run: Invoke-WebRequest -Uri 'http://advsys.net/ken/util/pngout.exe' -OutFile pngout.exe
    - run: Move-Item pngout.exe pngout-win-x64.exe
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-pngout-windows
        if-no-files-found: error
        retention-days: 1
        path: pngout-win-x64.exe

  pngout-linux:
    runs-on: ubuntu-latest
    steps:
    - run: Invoke-WebRequest -Uri 'https://www.jonof.id.au/files/kenutils/pngout-20200115-linux.tar.gz' -OutFile pngout.tar.gz
    - run: tar -xvf pngout.tar.gz
    - run: mv pngout-*/amd64/pngout pngout-linux-x64
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-pngout-linux
        if-no-files-found: error
        retention-days: 1
        path: pngout-linux-x64

  pngout-linux-arm64:
    runs-on: ubuntu-latest
    steps:
    - run: Invoke-WebRequest -Uri 'https://www.jonof.id.au/files/kenutils/pngout-20200115-linux.tar.gz' -OutFile pngout.tar.gz
    - run: tar -xvf pngout.tar.gz
    - run: mv pngout-*/aarch64/pngout pngout-linux-arm64
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-pngout-linux-arm64
        if-no-files-found: error
        retention-days: 1
        path: pngout-linux-arm64

  pngout-osx-arm64:
    runs-on: ubuntu-latest
    steps:
    - run: Invoke-WebRequest -Uri 'https://www.jonof.id.au/files/kenutils/pngout-20230322-mac.zip' -OutFile pngout.zip
    - run: |
        Expand-Archive pngout.zip -DestinationPath . -Force
        $pngout = Get-ChildItem -Path "." -Recurse -File -Filter "pngout" | Select-Object -First 1
        if (-not $pngout) {
          throw "pngout binary not found in macOS archive"
        }

        Move-Item -LiteralPath $pngout.FullName -Destination "./pngout-osx-arm64"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-pngout-osx-arm64
        if-no-files-found: error
        retention-days: 1
        path: pngout-osx-arm64

  ffmpeg-windows:
    runs-on: ubuntu-latest
    steps:
    - run: |
       $headers = @{
         "User-Agent" = "GitHub Actions"
         "Authorization" = "Bearer ${{ secrets.GITHUB_TOKEN }}"
       }

        $release = Invoke-RestMethod -Method Get -Uri https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest -Headers $headers
        $WindowsAsset = $release.assets | Where-Object { $_.name -cmatch '^ffmpeg-.*-win64-gpl-${{ env.FFMPEG_VERSION }}.zip$' }
        Invoke-WebRequest -Uri $WindowsAsset.browser_download_url -OutFile ffmpeg.zip
        Expand-Archive ffmpeg.zip -DestinationPath . -Verbose
        Get-ChildItem -Recurse -Include ffmpeg.exe, ffprobe.exe | Foreach-Object { Move-Item -LiteralPath $_ -Destination . }
        Move-Item ffmpeg.exe ffmpeg-win-x64.exe
        Move-Item ffprobe.exe ffprobe-win-x64.exe
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-ffmpeg-windows
        if-no-files-found: error
        retention-days: 1
        path: |
           ffmpeg-win-x64.exe
           ffprobe-win-x64.exe

  ffmpeg-windows-arm64:
    runs-on: ubuntu-latest
    steps:
    - run: |
       $headers = @{
         "User-Agent" = "GitHub Actions"
         "Authorization" = "Bearer ${{ secrets.GITHUB_TOKEN }}"
       }

        $release = Invoke-RestMethod -Method Get -Uri https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest -Headers $headers
        $WindowsAsset = $release.assets | Where-Object { $_.name -cmatch '^ffmpeg-.*-winarm64-gpl-${{ env.FFMPEG_VERSION }}.zip$' }
        Invoke-WebRequest -Uri $WindowsAsset.browser_download_url -OutFile ffmpeg.zip
        Expand-Archive ffmpeg.zip -DestinationPath . -Verbose
        Get-ChildItem -Recurse -Include ffmpeg.exe, ffprobe.exe | Foreach-Object { Move-Item -LiteralPath $_ -Destination . }
        Move-Item ffmpeg.exe ffmpeg-win-arm64.exe
        Move-Item ffprobe.exe ffprobe-win-arm64.exe
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-ffmpeg-windows-arm64
        if-no-files-found: error
        retention-days: 1
        path: |
           ffmpeg-win-arm64.exe
           ffprobe-win-arm64.exe

  ffmpeg-linux:
    runs-on: ubuntu-latest
    steps:
    - run: |
       $headers = @{
         "User-Agent" = "GitHub Actions"
         "Authorization" = "Bearer ${{ secrets.GITHUB_TOKEN }}"
       }

        $release = Invoke-RestMethod -Method Get -Uri https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest -Headers $headers
        $LinuxAsset = $release.assets | Where-Object { $_.name -cmatch '^ffmpeg-.*-linux64-gpl-${{ env.FFMPEG_VERSION }}.tar.xz$' }
        Invoke-WebRequest -Uri $LinuxAsset.browser_download_url -OutFile ffmpeg.tar.xz
        tar -xvf ffmpeg.tar.xz
        Get-ChildItem -Recurse -Include ffmpeg, ffprobe | Foreach-Object { Move-Item -LiteralPath $_ -Destination . }
        Move-Item ffmpeg ffmpeg-linux-x64
        Move-Item ffprobe ffprobe-linux-x64
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-ffmpeg-linux
        if-no-files-found: error
        retention-days: 1
        path: |
           ffmpeg-linux-x64
           ffprobe-linux-x64

  ffmpeg-linux-arm64:
    runs-on: ubuntu-latest
    steps:
    - run: |
       $headers = @{
         "User-Agent" = "GitHub Actions"
         "Authorization" = "Bearer ${{ secrets.GITHUB_TOKEN }}"
       }

        $release = Invoke-RestMethod -Method Get -Uri https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest -Headers $headers
        $LinuxAsset = $release.assets | Where-Object { $_.name -cmatch '^ffmpeg-.*-linuxarm64-gpl-${{ env.FFMPEG_VERSION }}.tar.xz$' }
        Invoke-WebRequest -Uri $LinuxAsset.browser_download_url -OutFile ffmpeg.tar.xz
        tar -xvf ffmpeg.tar.xz
        Get-ChildItem -Recurse -Filter ffmpeg | Foreach-Object { Move-Item -LiteralPath $_ -Destination ffmpeg-linux-arm64 }
        Get-ChildItem -Recurse -Filter ffprobe | Foreach-Object { Move-Item -LiteralPath $_ -Destination ffprobe-linux-arm64 }
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-ffmpeg-linux-arm64
        if-no-files-found: error
        retention-days: 1
        path: |
           ffmpeg-linux-arm64
           ffprobe-linux-arm64

  ffmpeg-custom-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ffmpeg-deps
        # No restore-keys on purpose: a partially matching prefix (stale headers
        # next to fresh .pc files) is worse than a cold build. Hashing ci.yml
        # means any dependency version bump forces a full rebuild.
        key: ffmpeg-deps-v1-linux-x64-${{ hashFiles('scripts/build-ffmpeg.sh', '.github/workflows/ci.yml') }}
    - name: Build (Alpine, fully static against musl)
      shell: bash
      run: |
        # Deliberately `docker run` rather than a job-level `container:` -- the
        # Actions runner injects a glibc-built node for JS actions, which cannot
        # run on musl. This way only the build itself happens inside Alpine.
        docker run --rm \
          -v "$PWD:/work" -w /work \
          -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
          -e FFMPEG_CUSTOM_VERSION -e ZLIB_VERSION -e BROTLI_VERSION -e HWY_VERSION \
          -e JXL_VERSION -e WEBP_VERSION -e OPUS_VERSION -e LIBVPX_VERSION \
          -e AOM_VERSION -e SVT_AV1_VERSION -e DAV1D_VERSION -e X265_VERSION -e X264_COMMIT \
          "$ALPINE_IMAGE" sh -euc '
            # Alpine has no "ninja" package, and its "meson" hard-depends on
            # samurai, which conflicts with real ninja -- hence pip for meson.
            apk add --no-cache build-base libstdc++-dev cmake ninja-build ninja-is-really-ninja \
              py3-pip python3 nasm yasm git curl bash perl pkgconf linux-headers xz \
              diffutils coreutils tar file
            pip install --break-system-packages --quiet meson
            # apk needs root, so everything written to /work is root-owned, which
            # breaks actions/cache save and the post-job workspace cleanup. Run
            # the chown from a trap so a failed build still leaves a usable tree.
            trap "chown -R $HOST_UID:$HOST_GID /work || true" EXIT
            bash scripts/build-ffmpeg.sh linux-x64
            bash scripts/verify-ffmpeg.sh linux-x64 all
          '
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-ffmpeg-custom-linux
        if-no-files-found: error
        retention-days: 1
        path: |
           ffmpeg-custom-linux-x64
           ffprobe-custom-linux-x64

  ffmpeg-custom-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ffmpeg-deps
        # No restore-keys on purpose: a partially matching prefix (stale headers
        # next to fresh .pc files) is worse than a cold build. Hashing ci.yml
        # means any dependency version bump forces a full rebuild.
        key: ffmpeg-deps-v1-linux-arm64-${{ hashFiles('scripts/build-ffmpeg.sh', '.github/workflows/ci.yml') }}
    - name: Build (Alpine, fully static against musl)
      shell: bash
      run: |
        # Deliberately `docker run` rather than a job-level `container:` -- the
        # Actions runner injects a glibc-built node for JS actions, which cannot
        # run on musl. This way only the build itself happens inside Alpine.
        docker run --rm \
          -v "$PWD:/work" -w /work \
          -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
          -e FFMPEG_CUSTOM_VERSION -e ZLIB_VERSION -e BROTLI_VERSION -e HWY_VERSION \
          -e JXL_VERSION -e WEBP_VERSION -e OPUS_VERSION -e LIBVPX_VERSION \
          -e AOM_VERSION -e SVT_AV1_VERSION -e DAV1D_VERSION -e X265_VERSION -e X264_COMMIT \
          "$ALPINE_IMAGE" sh -euc '
            # Alpine has no "ninja" package, and its "meson" hard-depends on
            # samurai, which conflicts with real ninja -- hence pip for meson.
            apk add --no-cache build-base libstdc++-dev cmake ninja-build ninja-is-really-ninja \
              py3-pip python3 nasm yasm git curl bash perl pkgconf linux-headers xz \
              diffutils coreutils tar file
            pip install --break-system-packages --quiet meson
            # apk needs root, so everything written to /work is root-owned, which
            # breaks actions/cache save and the post-job workspace cleanup. Run
            # the chown from a trap so a failed build still leaves a usable tree.
            trap "chown -R $HOST_UID:$HOST_GID /work || true" EXIT
            bash scripts/build-ffmpeg.sh linux-arm64
            bash scripts/verify-ffmpeg.sh linux-arm64 all
          '
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-ffmpeg-custom-linux-arm64
        if-no-files-found: error
        retention-days: 1
        path: |
           ffmpeg-custom-linux-arm64
           ffprobe-custom-linux-arm64

  ffmpeg-custom-windows:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Install build tools
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential cmake ninja-build meson nasm yasm pkgconf git curl xz-utils file
    - name: Install llvm-mingw
      shell: bash
      run: |
        uri="https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/llvm-mingw-$LLVM_MINGW_VERSION-ucrt-ubuntu-22.04-x86_64.tar.xz"
        for attempt in 1 2 3 4 5; do
          if curl -fsSL "$uri" -o llvm-mingw.tar.xz && tar -tJf llvm-mingw.tar.xz > /dev/null 2>&1; then
            break
          fi
          if [ "$attempt" -eq 5 ]; then echo "failed to download llvm-mingw" >&2; exit 1; fi
          sleep $((2 * attempt))
        done
        mkdir -p "$HOME/llvm-mingw"
        tar -xJf llvm-mingw.tar.xz -C "$HOME/llvm-mingw" --strip-components=1
        echo "LLVM_MINGW_ROOT=$HOME/llvm-mingw" >> "$GITHUB_ENV"
        echo "$HOME/llvm-mingw/bin" >> "$GITHUB_PATH"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ffmpeg-deps
        key: ffmpeg-deps-v1-win-x64-${{ hashFiles('scripts/build-ffmpeg.sh', '.github/workflows/ci.yml') }}
    - name: Cross-compile for Windows x64
      shell: bash
      run: bash scripts/build-ffmpeg.sh win-x64
    - name: Verify static linkage
      shell: bash
      # Cross-compiled, so it cannot be executed here; the functional smoke
      # tests run in ffmpeg-custom-windows-test on a real Windows runner.
      run: bash scripts/verify-ffmpeg.sh win-x64 link
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-ffmpeg-custom-windows
        if-no-files-found: error
        retention-days: 1
        path: |
           ffmpeg-custom-win-x64.exe
           ffprobe-custom-win-x64.exe

  ffmpeg-custom-windows-arm64:
