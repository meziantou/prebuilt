  ffmpeg-custom-windows-test:
    runs-on: windows-latest
    needs: [ffmpeg-custom-windows]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: binaries-ffmpeg-custom-windows
        path: .
    - name: Smoke test
      shell: bash
      run: bash scripts/verify-ffmpeg.sh win-x64 run

  ffmpeg-custom-windows-arm64-test:
    runs-on: windows-11-arm
    needs: [ffmpeg-custom-windows-arm64]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: binaries-ffmpeg-custom-windows-arm64
        path: .
