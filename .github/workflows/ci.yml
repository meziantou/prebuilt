name: Build
on:
  push:
    branches:
      - 'main'
  pull_request:
  workflow_dispatch:
    inputs:
      rebuild:
        description: Build every tool, even the ones the latest release already has
        type: boolean
        default: false

defaults:
  run:
    shell: pwsh

env:
  VERSION: 3.11.0
  # Read by scripts/Get-BuildPlan.ps1: true builds everything (workflow_dispatch input).
  FORCE_REBUILD: ${{ inputs.rebuild == true }}
  PNGOUT_VERSION: 1.0.0 # http://advsys.net/ken/utils.htm#pngout - manual version
  ZOPFLI_VERSION: "1.0.3" # https://github.com/google/zopfli/tags
  OXIPNG_VERSION: "10.2.1" # https://github.com/shssoichiro/oxipng/releases
  FFMPEG_VERSION: "9.0.2" # https://github.com/FFmpeg/FFmpeg/tags - built from tag n<version>
  LLVM_MINGW_VERSION: "20261006" # https://github.com/mstorsjo/llvm-mingw/releases
  # Alpine 3.23 ships CMake 4, which several of the dependencies below reject.
  ALPINE_IMAGE: "alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce"
  ZLIB_VERSION: "1.3.2" # https://github.com/madler/zlib/tags
  BROTLI_VERSION: "1.2.0" # https://github.com/google/brotli/tags
  HWY_VERSION: "1.4.0" # https://github.com/google/highway/tags - tags have no leading v
  JXL_VERSION: "0.12.0" # https://github.com/libjxl/libjxl/releases - pinned; 0.12 changed skcms/CMS handling - also the released cjxl/djxl/jxlinfo/jxl_from_tree tools
  LIBPNG_VERSION: "1.6.59" # https://github.com/pnggroup/libpng/tags - PNG and APNG support of cjxl/djxl, PNG glyphs and PNG output of the HarfBuzz tools; 1.6.x, the 1.7 tags are betas
  JXL_OXIDE_VERSION: "0.12.6" # https://crates.io/crates/jxl-oxide-cli
  RUST_TOOLCHAIN: "1.99.0" # https://github.com/rust-lang/rust/releases - builds jxl-oxide
  WEBP_VERSION: "1.6.0" # https://github.com/webmproject/libwebp/tags - also the released cwebp/dwebp/webpmux/... tools
  LIBAVIF_VERSION: "1.4.2" # https://github.com/AOMediaCodec/libavif/releases - avifenc/avifdec; releases only: the Windows and macOS binaries are release assets
  HARFBUZZ_VERSION: "14.6.0" # https://github.com/harfbuzz/harfbuzz/releases - hb-shape/hb-info/hb-subset/hb-vector/hb-raster; glib, libffi, pcre2 and freetype are the versions its meson wraps pin
  WOFF2_COMMIT: "fb9c3379f2605b10f3e8f1d9636664ab5576775c" # https://github.com/google/woff2 - master branch; woff2_compress/woff2_decompress/woff2_info; no tag since v1.0.2 (2017)
  OPENJPEG_VERSION: "2.5.4" # https://github.com/uclouvain/openjpeg/releases - opj_compress/opj_decompress/opj_dump, built from tag v<version>
  OPENJPH_VERSION: "0.32.0" # https://github.com/aous72/OpenJPH/releases - ojph_compress/ojph_expand; tags have no leading v
  ISO_JPEG_COMMIT: "702114c8130ae818ccd2354cc03e879dac69e579" # https://github.com/thorfdbg/libjpeg - master branch; the jpeg tool of the ISO JPEG reference codec, released as iso-jpeg; no release tag
  ISO_JPEG_VERSION: "1.72" # last release of README.history at ISO_JPEG_COMMIT - scripts/build-iso-jpeg.sh fails when it is not
  OPUS_VERSION: "1.5.2" # https://github.com/xiph/opus/releases - releases only; v1.6.x tags ship no tarball
  LIBVPX_VERSION: "1.17.0" # https://github.com/webmproject/libvpx/tags
  AOM_VERSION: "3.15.1" # https://aomedia.googlesource.com/aom
  SVT_AV1_VERSION: "4.2.0" # https://gitlab.com/AOMediaCodec/SVT-AV1/-/tags
  DAV1D_VERSION: "1.5.4" # https://code.videolan.org/videolan/dav1d/-/tags
  X265_VERSION: "4.2" # https://bitbucket.org/multicoreware/x265_git/downloads/?tab=tags - built for 8, 10 and 12 bits; also the released x265 tool and the encoder of heif-enc
  KVAZAAR_VERSION: "2.3.2" # https://github.com/ultravideo/kvazaar/tags - libkvazaar of ffmpeg and the released kvazaar tool
  LIBDE265_VERSION: "1.1.3" # https://github.com/strukturag/libde265/releases - dec265 and the decoder of heif-dec
  LIBHEIF_VERSION: "1.23.6" # https://github.com/strukturag/libheif/releases - heif-enc/heif-dec/heif-info
  HM_VERSION: "18.0" # https://vcgit.hhi.fraunhofer.de/jvet/HM/-/tags - TAppEncoder/TAppDecoder, built from tag HM-<version>
  QPDF_VERSION: "12.4.2" # https://github.com/qpdf/qpdf/releases - qpdf, built from the release tarball of tag v<version>
  LIBJPEG_TURBO_VERSION: "3.2.0" # https://github.com/libjpeg-turbo/libjpeg-turbo/releases - the libjpeg of qpdf (scripts/pdf-libs.sh)
  MUPDF_VERSION: "1.28.5" # https://mupdf.com/releases - mutool, built from mupdf-<version>-source.tar.gz with its third-party libraries
  POPPLER_VERSION: "26.10.0" # https://poppler.freedesktop.org/releases.html - pdftoppm/pdftotext/pdffonts/pdfinfo/pdfsig
  FREETYPE_VERSION: "2.15.0" # https://github.com/freetype/freetype/tags - the FreeType of Poppler (scripts/pdf-libs.sh), built from tag VER-<version with dashes>
  LCMS2_VERSION: "2.19.1" # https://github.com/mm2/Little-CMS/releases - the LittleCMS of Poppler (scripts/pdf-libs.sh)
  NSS_VERSION: "3.132" # https://ftp.mozilla.org/pub/security/nss/releases/ - the signature backend of pdfsig (scripts/pdf-libs.sh)
  NSPR_VERSION: "4.39" # the NSPR bundled with NSS_VERSION: nss-<NSS_VERSION>-with-nspr-<NSPR_VERSION>.tar.gz
  ARLINGTON_COMMIT: "d148fee5a0cb6dcacadf58c09ed842e32847024d" # https://github.com/pdf-association/arlington-pdf-model - master branch; TestGrammar and the TSV files of the model; no release since v0.5 (2021)
  ARLINGTON_VERSION: "0.81" # TestGrammar_VERSION of TestGrammar/src/TestGrammarVers.h at ARLINGTON_COMMIT - scripts/build-arlington.sh fails when it is not
  VERAPDF_VERSION: "1.30.3" # https://software.verapdf.org/releases/ - the veraPDF CLI, from verapdf-greenfield-<version>-installer.zip; even minor versions are the releases
  TEMURIN_VERSION: "21.0.12.1+1" # https://adoptium.net/temurin/releases/ - the Java runtime of the veraPDF bundle (jlink); a release published for every target
  PDFIUM_VERSION: "8111" # https://github.com/bblanchon/pdfium-binaries/releases - pdfium_test, built from the PDFium branch chromium/<version>
  DEPOT_TOOLS_COMMIT: "b1c2e86792a7f2b6576c181b7327ddd53b1a42a8" # https://chromium.googlesource.com/chromium/tools/depot_tools - main branch; the gclient/gn/ninja of the PDFium build
  X264_COMMIT: "b35605ace3ddf7c1a5d67a2eb553f034aef41d55" # https://code.videolan.org/videolan/x264 - stable branch

jobs:
  create-release:
    runs-on: ubuntu-latest
    needs: [
      build-plan,
      versions_json,
      zopfli-linux,
      zopfli-linux-arm64,
      zopfli-windows,
      zopfli-osx-arm64,
      oxipng-linux,
      oxipng-linux-arm64,
      oxipng-windows,
      oxipng-osx-arm64,
      ffmpeg-linux,
      ffmpeg-linux-arm64,
      ffmpeg-windows,
      ffmpeg-windows-arm64,
      ffmpeg-windows-test,
      ffmpeg-windows-arm64-test,
      ffmpeg-osx-arm64,
      pngout-linux,
      pngout-linux-arm64,
      pngout-windows,
      pngout-osx-arm64,
      libwebp,
      libavif,
      libjxl,
      libjxl-windows-test,
      jxl-oxide,
      woff2,
      woff2-windows-test,
      harfbuzz,
      harfbuzz-windows-test,
      openjpeg,
      openjpeg-windows-test,
      openjph,
      openjph-windows-test,
      iso-jpeg,
      iso-jpeg-windows-test,
      libheif,
      libheif-windows-test,
      hm,
      hm-windows-test,
      hevc-test,
      qpdf,
      qpdf-windows-test,
      mupdf,
      mupdf-windows-test,
      poppler,
      poppler-windows-test,
      arlington,
      arlington-windows-test,
      verapdf,
      verapdf-windows-test,
      pdfium,
      pdfium-linux-arm64-test
    ]
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    # One folder per artifact, not merge-multiple: the files of each artifact
    # are recorded in build-keys.json, for the next runs to reuse.
    - id: download_release_artifacts
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        pattern: 'binaries-*'
        path: artifacts
    - if: steps.download_release_artifacts.outcome == 'failure'
      run: Remove-Item -LiteralPath artifacts -Recurse -Force -ErrorAction SilentlyContinue
    - if: steps.download_release_artifacts.outcome == 'failure'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        pattern: 'binaries-*'
        path: artifacts
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: build-keys
        path: build-keys
    - name: Gather the release files
      run: >-
        ./scripts/Merge-ReleaseArtifacts.ps1
        -ArtifactsPath artifacts
        -KeysPath build-keys/build-keys.json
        -OutputPath binaries
    - name: Generate tool manifest
      run: >-
        ./scripts/New-PrebuiltManifest.ps1
        -BinariesPath binaries
        -ReleaseVersion "${{ env.VERSION }}"
        -DownloadBaseUrl "https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/"
        -OutputPath binaries/prebuilt-tools.json
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: nuget-manifest
        if-no-files-found: error
        retention-days: 1
        path: binaries/prebuilt-tools.json
    - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: 'gh release create "${{ env.VERSION }}" --target "${{ github.sha }}" ./binaries/*'
      env:
        GH_TOKEN: ${{ github.token }}

  # Meziantou.Prebuilt: the release version, plus a manifest of the release
  # files (with their checksums) embedded in the assembly. Pushed after
  # create-release so the download URLs exist when the package goes live.
  nuget:
    runs-on: ubuntu-latest
    needs: [create-release]
    permissions:
      id-token: write # Required for OIDC token issuance for trusted publishing
      contents: read
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: true
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        global-json-file: global.json
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: nuget-manifest
        path: manifest
    - run: dotnet test --configuration Release -p:PrebuiltManifestPath=${{ github.workspace }}/manifest/prebuilt-tools.json
    - run: dotnet pack src/Meziantou.Prebuilt --configuration Release --output ./artifacts -p:Version=${{ env.VERSION }} -p:PrebuiltManifestPath=${{ github.workspace }}/manifest/prebuilt-tools.json
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: nuget-packages
        if-no-files-found: error
        path: ./artifacts/*.nupkg
    - name: NuGet login (OIDC → temp API key)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: nuget/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      id: nuget-login
      with:
        user: meziantou
    - name: Push to NuGet.org
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  # Gives every build and test of the tools built from source a key, the hash
  # of everything it depends on, and compares it with the key the latest
  # release recorded (scripts/Get-BuildPlan.ps1). The jobs whose key did not
  # change run on ubuntu-latest: a build downloads its files from that release
  # (scripts/Get-ReleaseFiles.ps1) and a test does nothing. So a run that
  # changes one tool neither rebuilds the others nor waits for a macOS or
  # Windows runner for them.
  build-plan:
    runs-on: ubuntu-latest
    outputs:
      reuse: ${{ steps.plan.outputs.reuse }}
      release: ${{ steps.plan.outputs.release }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - id: plan
      env:
        GH_TOKEN: ${{ github.token }}
      run: ./scripts/Get-BuildPlan.ps1 -OutputPath build-keys/build-keys.json
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: build-keys
        if-no-files-found: error
        retention-days: 1
        path: build-keys/build-keys.json

  versions_json:
    runs-on: ubuntu-latest
    steps:
    - run: |
        $versions = @{}
        $versions.Zopfli = "${{ env.ZOPFLI_VERSION }}"
        $versions.Oxipng = "${{ env.OXIPNG_VERSION }}"
        $versions.FFmpeg = "${{ env.FFMPEG_VERSION }}"
        $versions.Pngout = "${{ env.PNGOUT_VERSION }}"
        $versions.LibWebP = "${{ env.WEBP_VERSION }}"
        $versions.LibAvif = "${{ env.LIBAVIF_VERSION }}"
        $versions.LibJxl = "${{ env.JXL_VERSION }}"
        $versions.JxlOxide = "${{ env.JXL_OXIDE_VERSION }}"
        $versions.HarfBuzz = "${{ env.HARFBUZZ_VERSION }}"
        # woff2 has no tag since v1.0.2, the version its build files still declare.
        $versions.Woff2 = "1.0.2+" + "${{ env.WOFF2_COMMIT }}".Substring(0, 7)
        $versions.OpenJpeg = "${{ env.OPENJPEG_VERSION }}"
        $versions.OpenJph = "${{ env.OPENJPH_VERSION }}"
        # libjpeg has no release tag: the last release of its README.history.
        $versions.IsoJpeg = "${{ env.ISO_JPEG_VERSION }}+" + "${{ env.ISO_JPEG_COMMIT }}".Substring(0, 7)
        $versions.X265 = "${{ env.X265_VERSION }}"
        $versions.Kvazaar = "${{ env.KVAZAAR_VERSION }}"
        $versions.LibDe265 = "${{ env.LIBDE265_VERSION }}"
        $versions.LibHeif = "${{ env.LIBHEIF_VERSION }}"
        $versions.HM = "${{ env.HM_VERSION }}"
        $versions.Qpdf = "${{ env.QPDF_VERSION }}"
        $versions.MuPdf = "${{ env.MUPDF_VERSION }}"
        $versions.Poppler = "${{ env.POPPLER_VERSION }}"
        # The Arlington repository has no recent tag: the version of TestGrammar.
        $versions.Arlington = "${{ env.ARLINGTON_VERSION }}+" + "${{ env.ARLINGTON_COMMIT }}".Substring(0, 7)
        $versions.VeraPdf = "${{ env.VERAPDF_VERSION }}"
        # PDFium has no releases: the N of its chromium/<N> branch.
        $versions.Pdfium = "${{ env.PDFIUM_VERSION }}"
        ConvertTo-Json $versions | Out-File versions.json
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-versions
        if-no-files-found: error
        retention-days: 1
        path: 'versions.json'

  zopfli-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: google/zopfli
        ref: zopfli-${{ env.ZOPFLI_VERSION }}
    - run: make zopfli
    - run: |
        mv zopfli zopfli-linux-x64
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-zopfli-linux
        if-no-files-found: error
        retention-days: 1
        path: zopfli-linux-x64

  zopfli-linux-arm64:
    runs-on: ubuntu-26.04-arm
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: google/zopfli
        ref: zopfli-${{ env.ZOPFLI_VERSION }}
    - run: make zopfli
    - run: |
        mv zopfli zopfli-linux-arm64
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-zopfli-linux-arm64
        if-no-files-found: error
        retention-days: 1
        path: zopfli-linux-arm64

  zopfli-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: google/zopfli
        ref: zopfli-${{ env.ZOPFLI_VERSION }}
    - name: Enable Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      with:
        arch: x64
    - run: |
        foreach($item in (Get-ChildItem src\zopfli -Filter *.c -Recurse)) {
          Write-Host "Compiling $item"
          & cl -nologo -O2 /GL /GS- /I$env:CRT_INC_PATH /I. -c /MD /DNDEBUG "$item"
        }

        Write-Host "Linking zopfli.exe"
        & link -nologo /LTCG /OUT:zopfli.exe *.obj user32.lib advapi32.lib kernel32.lib

        Move-Item zopfli.exe zopfli-win-x64.exe
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-zopfli-windows
        if-no-files-found: error
        retention-days: 1
        path: zopfli-win-x64.exe

  zopfli-osx-arm64:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: google/zopfli
        ref: zopfli-${{ env.ZOPFLI_VERSION }}
    - run: make zopfli
    - run: |
        Move-Item zopfli zopfli-osx-arm64
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-zopfli-osx-arm64
        if-no-files-found: error
        retention-days: 1
        path: zopfli-osx-arm64

  oxipng-windows:
    runs-on: ubuntu-latest
    steps:
    - run: |
       $uri = 'https://github.com/shssoichiro/oxipng/releases/download/v${{ env.OXIPNG_VERSION }}/oxipng-${{ env.OXIPNG_VERSION }}-x86_64-pc-windows-msvc.zip'
       $archivePath = "oxipng.zip"
       for ($attempt = 1; $attempt -le 5; $attempt++) {
         try {
           Invoke-WebRequest -Uri $uri -OutFile $archivePath -ErrorAction Stop
         } catch {
           if ($attempt -eq 5) {
             throw
           }
           Start-Sleep -Seconds (2 * $attempt)
           continue
         }
         & unzip -tqq $archivePath *> $null
         if ($LASTEXITCODE -eq 0) {
           break
         }
         if ($attempt -eq 5) {
           throw "Failed to download a valid oxipng archive after $attempt attempts"
         }
         Remove-Item -LiteralPath $archivePath -Force -ErrorAction SilentlyContinue
         Start-Sleep -Seconds (2 * $attempt)
       }
    - run: Expand-Archive oxipng.zip -DestinationPath .
    - run: |
        Get-ChildItem -Path ".\" -Recurse -Filter "oxipng.exe" | Copy-Item -Destination ".\"
        Move-Item oxipng.exe oxipng-win-x64.exe
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-oxipng-windows
        if-no-files-found: error
        retention-days: 1
        path: 'oxipng-win-x64.exe'

  oxipng-linux:
    runs-on: ubuntu-latest
    steps:
    - run: |
       $uri = 'https://github.com/shssoichiro/oxipng/releases/download/v${{ env.OXIPNG_VERSION }}/oxipng-${{ env.OXIPNG_VERSION }}-x86_64-unknown-linux-musl.tar.gz'
       $archivePath = "oxipng.tar.gz"
       for ($attempt = 1; $attempt -le 5; $attempt++) {
         try {
           Invoke-WebRequest -Uri $uri -OutFile $archivePath -ErrorAction Stop
         } catch {
           if ($attempt -eq 5) {
             throw
           }
           Start-Sleep -Seconds (2 * $attempt)
           continue
         }
         & tar -tzf $archivePath *> $null
         if ($LASTEXITCODE -eq 0) {
           break
         }
         if ($attempt -eq 5) {
           throw "Failed to download a valid oxipng archive after $attempt attempts"
         }
         Remove-Item -LiteralPath $archivePath -Force -ErrorAction SilentlyContinue
         Start-Sleep -Seconds (2 * $attempt)
       }
    - run: tar -xvf oxipng.tar.gz
    - run: mv oxipng-*-x86_64-unknown-linux-musl/oxipng oxipng-linux-x64
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-oxipng-linux
        if-no-files-found: error
        retention-days: 1
        path: 'oxipng-linux-x64'

  oxipng-linux-arm64:
    runs-on: ubuntu-latest
    steps:
    - run: |
       $uri = 'https://github.com/shssoichiro/oxipng/releases/download/v${{ env.OXIPNG_VERSION }}/oxipng-${{ env.OXIPNG_VERSION }}-aarch64-unknown-linux-musl.tar.gz'
       $archivePath = "oxipng.tar.gz"
       for ($attempt = 1; $attempt -le 5; $attempt++) {
         try {
           Invoke-WebRequest -Uri $uri -OutFile $archivePath -ErrorAction Stop
         } catch {
           if ($attempt -eq 5) {
             throw
           }
           Start-Sleep -Seconds (2 * $attempt)
           continue
         }
         & tar -tzf $archivePath *> $null
         if ($LASTEXITCODE -eq 0) {
           break
         }
         if ($attempt -eq 5) {
           throw "Failed to download a valid oxipng archive after $attempt attempts"
         }
         Remove-Item -LiteralPath $archivePath -Force -ErrorAction SilentlyContinue
         Start-Sleep -Seconds (2 * $attempt)
       }
    - run: tar -xvf oxipng.tar.gz
    - run: mv oxipng-*-aarch64-unknown-linux-musl/oxipng oxipng-linux-arm64
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-oxipng-linux-arm64
        if-no-files-found: error
        retention-days: 1
        path: 'oxipng-linux-arm64'

  oxipng-osx-arm64:
    runs-on: ubuntu-latest
    steps:
    - run: |
       $uri = 'https://github.com/shssoichiro/oxipng/releases/download/v${{ env.OXIPNG_VERSION }}/oxipng-${{ env.OXIPNG_VERSION }}-aarch64-apple-darwin.tar.gz'
       $archivePath = "oxipng.tar.gz"
       for ($attempt = 1; $attempt -le 5; $attempt++) {
         try {
           Invoke-WebRequest -Uri $uri -OutFile $archivePath -ErrorAction Stop
         } catch {
           if ($attempt -eq 5) {
             throw
           }
           Start-Sleep -Seconds (2 * $attempt)
           continue
         }
         & tar -tzf $archivePath *> $null
         if ($LASTEXITCODE -eq 0) {
           break
         }
         if ($attempt -eq 5) {
           throw "Failed to download a valid oxipng archive after $attempt attempts"
         }
         Remove-Item -LiteralPath $archivePath -Force -ErrorAction SilentlyContinue
         Start-Sleep -Seconds (2 * $attempt)
       }
    - run: tar -xvf oxipng.tar.gz
    - run: mv oxipng-*-aarch64-apple-darwin/oxipng oxipng-osx-arm64
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-oxipng-osx-arm64
        if-no-files-found: error
        retention-days: 1
        path: 'oxipng-osx-arm64'

  # The pngout hosts sit behind bot protection that intermittently answers a
  # runner with something that is not the file, for longer than it is worth
  # retrying. The files are pinned by SHA-256 and never change, so they are kept
  # in actions/cache (keyed on the hash) and the hosts are only contacted on a
  # cache miss, with a Wayback Machine snapshot of the same bytes as a fallback.
  # Get-VerifiedFile.ps1 checks the hash whichever of the three the file comes from.
  pngout-windows:
    runs-on: ubuntu-latest
    env:
      PNGOUT_SHA256: 843f0be42e86680c1663c4ef58eb0677ace15fc29ab23897c83f4b7e5af3ef36
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: pngout-download
        key: pngout-download-${{ env.PNGOUT_SHA256 }}
    - run: >-
        ./scripts/Get-VerifiedFile.ps1
        -OutFile pngout-download/pngout.exe
        -Sha256 "${{ env.PNGOUT_SHA256 }}"
        -Uri
        "https://advsys.net/ken/util/pngout.exe",
        "https://web.archive.org/web/20260930221300id_/http://advsys.net/ken/util/pngout.exe"
    # Copy, not move: the cache is saved from pngout-download after the job.
    - run: Copy-Item pngout-download/pngout.exe pngout-win-x64.exe
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-pngout-windows
        if-no-files-found: error
        retention-days: 1
        path: pngout-win-x64.exe

  pngout-linux:
    runs-on: ubuntu-latest
    env:
      PNGOUT_SHA256: ac38bba6f0de29033de866538c3afa64341319b695bbe388efbc5fd9e830e928
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: pngout-download
        key: pngout-download-${{ env.PNGOUT_SHA256 }}
    - run: >-
        ./scripts/Get-VerifiedFile.ps1
        -OutFile pngout-download/pngout.tar.gz
        -Sha256 "${{ env.PNGOUT_SHA256 }}"
        -Uri
        "https://www.jonof.id.au/files/kenutils/pngout-20200115-linux.tar.gz",
        "https://web.archive.org/web/20260222142256id_/https://jonof.id.au/files/kenutils/pngout-20200115-linux.tar.gz"
    - run: tar -xvf pngout-download/pngout.tar.gz
    - run: mv pngout-*-linux/amd64/pngout pngout-linux-x64
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-pngout-linux
        if-no-files-found: error
        retention-days: 1
        path: pngout-linux-x64

  pngout-linux-arm64:
    runs-on: ubuntu-latest
    env:
      PNGOUT_SHA256: ac38bba6f0de29033de866538c3afa64341319b695bbe388efbc5fd9e830e928
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: pngout-download
        key: pngout-download-${{ env.PNGOUT_SHA256 }}
    - run: >-
        ./scripts/Get-VerifiedFile.ps1
        -OutFile pngout-download/pngout.tar.gz
        -Sha256 "${{ env.PNGOUT_SHA256 }}"
        -Uri
        "https://www.jonof.id.au/files/kenutils/pngout-20200115-linux.tar.gz",
        "https://web.archive.org/web/20260222142256id_/https://jonof.id.au/files/kenutils/pngout-20200115-linux.tar.gz"
    - run: tar -xvf pngout-download/pngout.tar.gz
    - run: mv pngout-*-linux/aarch64/pngout pngout-linux-arm64
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-pngout-linux-arm64
        if-no-files-found: error
        retention-days: 1
        path: pngout-linux-arm64

  pngout-osx-arm64:
    runs-on: ubuntu-latest
    env:
      PNGOUT_SHA256: 2e3eb79345206040ae3a0d0d0ecfe9ad01d92fe5002b8a1676a65632a56840e1
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: pngout-download
        key: pngout-download-${{ env.PNGOUT_SHA256 }}
    - run: >-
        ./scripts/Get-VerifiedFile.ps1
        -OutFile pngout-download/pngout.zip
        -Sha256 "${{ env.PNGOUT_SHA256 }}"
        -Uri
        "https://www.jonof.id.au/files/kenutils/pngout-20230322-mac.zip",
        "https://web.archive.org/web/20260723183131id_/https://www.jonof.id.au/files/kenutils/pngout-20230322-mac.zip"
    - run: |
        Expand-Archive pngout-download/pngout.zip -DestinationPath pngout-extracted -Force
        $pngout = Get-ChildItem -Path pngout-extracted -Recurse -File -Filter "pngout" | Select-Object -First 1
        if (-not $pngout) {
          throw "pngout binary not found in macOS archive"
        }

        Move-Item -LiteralPath $pngout.FullName -Destination "./pngout-osx-arm64"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-pngout-osx-arm64
        if-no-files-found: error
        retention-days: 1
        path: pngout-osx-arm64

  # Repackages Google's official, statically linked libwebp command-line tools.
  # Only cwebp, dwebp, webpmux and anim_dump are shipped; the other tools of the
  # archive are skipped. Google publishes no Windows arm64 build.
  libwebp:
    strategy:
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
            archive: linux-x86-64.tar.gz
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            archive: linux-aarch64.tar.gz
          - rid: win-x64
            os: windows-latest
            archive: windows-x64.zip
          - rid: osx-arm64
            os: macos-latest
            archive: mac-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
    - run: |
       $uri = "https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-${{ env.WEBP_VERSION }}-${{ matrix.archive }}"
       $archivePath = "libwebp-${{ matrix.archive }}"
       for ($attempt = 1; $attempt -le 5; $attempt++) {
         try {
           Invoke-WebRequest -Uri $uri -OutFile $archivePath -ErrorAction Stop
         } catch {
           if ($attempt -eq 5) {
             throw
           }
           Start-Sleep -Seconds (2 * $attempt)
           continue
         }
         & tar -tf $archivePath *> $null
         if ($LASTEXITCODE -eq 0) {
           break
         }
         if ($attempt -eq 5) {
           throw "Failed to download a valid libwebp archive after $attempt attempts"
         }
         Remove-Item -LiteralPath $archivePath -Force -ErrorAction SilentlyContinue
         Start-Sleep -Seconds (2 * $attempt)
       }

       New-Item -ItemType Directory -Path extracted | Out-Null
       & tar -xf $archivePath -C extracted
       if ($LASTEXITCODE -ne 0) {
         throw "Failed to extract $archivePath"
       }

       $exe = if ("${{ matrix.rid }}".StartsWith("win-")) { ".exe" } else { "" }
       $binDir = "extracted/libwebp-${{ env.WEBP_VERSION }}-$("${{ matrix.archive }}" -replace '\.(tar\.gz|zip)$', '')/bin"
       New-Item -ItemType Directory -Path out | Out-Null
       foreach ($tool in "cwebp", "dwebp", "webpmux", "anim_dump") {
         $source = Join-Path $binDir "$tool$exe"
         if (-not (Test-Path -LiteralPath $source)) {
           throw "$tool$exe not found in $archivePath"
         }

         $destination = "out/$tool-${{ matrix.rid }}$exe"
         Copy-Item -LiteralPath $source -Destination $destination
         if (-not $IsWindows) {
           & chmod +x $destination
         }

         # Smoke test on the native runner: the binary starts and reports the expected version.
         $output = @(& $destination -version)
         $version = "$($output | Select-Object -First 1)".Trim()
         if ($LASTEXITCODE -ne 0 -or $version -notmatch "^(WebP (Encoder|Decoder) version: )?$([regex]::Escape('${{ env.WEBP_VERSION }}'))$") {
           throw "$tool reported version '$version', expected ${{ env.WEBP_VERSION }}"
         }
         Write-Host "$tool $version"
       }
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-libwebp-${{ matrix.rid }}
        if-no-files-found: error
        retention-days: 1
        path: out/*

  # avifenc and avifdec, with libaom to encode and dav1d to decode.
  # The Windows x64 and macOS arm64 binaries are the ones of the libavif
  # release. That release has no Linux arm64 build, and its Linux x64 build
  # links glibc and libstdc++ dynamically, so both Linux targets are built from
  # the same sources with the same configuration (scripts/build-libavif.sh).
  # libavif publishes no Windows arm64 build.
  libavif:
    needs: [build-plan]
    strategy:
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: win-x64
            os: windows-latest
            archive: windows-artifacts.zip
          - rid: osx-arm64
            os: macos-latest
            archive: macOS-artifacts.zip
    runs-on: ${{ fromJSON(needs.build-plan.outputs.reuse)[format('binaries-libavif-{0}', matrix.rid)] && 'ubuntu-latest' || matrix.os }}
    env:
      REUSE: ${{ fromJSON(needs.build-plan.outputs.reuse)[format('binaries-libavif-{0}', matrix.rid)] }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Download the binaries of the previous release
      if: env.REUSE == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: ./scripts/Get-ReleaseFiles.ps1 -Tag "${{ needs.build-plan.outputs.release }}" -Artifact binaries-libavif-${{ matrix.rid }}
    - name: Repackage the libavif release
      if: env.REUSE != 'true' && matrix.archive
      run: |
       $uri = "https://github.com/AOMediaCodec/libavif/releases/download/v${{ env.LIBAVIF_VERSION }}/${{ matrix.archive }}"
       $archivePath = "libavif-${{ matrix.archive }}"
       for ($attempt = 1; $attempt -le 5; $attempt++) {
         try {
           Invoke-WebRequest -Uri $uri -OutFile $archivePath -ErrorAction Stop
         } catch {
           if ($attempt -eq 5) {
             throw
           }
           Start-Sleep -Seconds (2 * $attempt)
           continue
         }
         & tar -tf $archivePath *> $null
         if ($LASTEXITCODE -eq 0) {
           break
         }
         if ($attempt -eq 5) {
           throw "Failed to download a valid libavif archive after $attempt attempts"
         }
         Remove-Item -LiteralPath $archivePath -Force -ErrorAction SilentlyContinue
         Start-Sleep -Seconds (2 * $attempt)
       }

       New-Item -ItemType Directory -Path libavif-extracted | Out-Null
       & tar -xf $archivePath -C libavif-extracted
       if ($LASTEXITCODE -ne 0) {
         throw "Failed to extract $archivePath"
       }

       $exe = if ("${{ matrix.rid }}".StartsWith("win-")) { ".exe" } else { "" }
       foreach ($tool in "avifenc", "avifdec") {
         $source = "libavif-extracted/$tool$exe"
         if (-not (Test-Path -LiteralPath $source)) {
           throw "$tool$exe not found in $archivePath"
         }

         $destination = "$tool-${{ matrix.rid }}$exe"
         Copy-Item -LiteralPath $source -Destination $destination
         if (-not $IsWindows) {
           & chmod +x $destination
         }
       }
    - name: Build (Alpine, fully static against musl)
      if: env.REUSE != 'true' && !matrix.archive
      shell: bash
      run: |
        # `docker run` rather than a job-level `container:`, as for ffmpeg-linux.
        image="$(bash scripts/docker-pull.sh "$ALPINE_IMAGE")"
        docker run --rm \
          -v "$PWD:/work" -w /work \
          -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
          -e LIBAVIF_VERSION \
          "$image" sh -euc '
            # meson (for dav1d) comes from pip for the same reason as in ffmpeg-linux.
            apk add --no-cache build-base clang libstdc++-dev cmake ninja-build ninja-is-really-ninja \
              py3-pip python3 nasm git curl bash perl pkgconf linux-headers tar
            pip install --break-system-packages --quiet meson
            # Everything written to /work is root-owned; hand it back to the
            # runner user so the next steps and the post-job cleanup work.
            trap "chown -R $HOST_UID:$HOST_GID /work || true" EXIT
            bash scripts/build-libavif.sh ${{ matrix.rid }}
          '
    - name: Verify and smoke test
      if: env.REUSE != 'true'
      shell: bash
      # On the runner itself, on every platform: for Linux this also checks that
      # the musl binaries run outside of Alpine.
      run: bash scripts/verify-libavif.sh ${{ matrix.rid }} all
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-libavif-${{ matrix.rid }}
        if-no-files-found: error
        retention-days: 1
        path: |
           avifenc-${{ matrix.rid }}*
           avifdec-${{ matrix.rid }}*

  # cjxl, djxl, jxlinfo and jxl_from_tree. Every target is built from the
  # libjxl sources (scripts/build-libjxl.sh): the libjxl release has no macOS
  # and no Linux arm64 binaries, and none of its archives has jxl_from_tree.
  # libjxl, highway, brotli and zlib are the versions ffmpeg is built with.
  # No Windows arm64 build, as for the other image tools.
  libjxl:
    needs: [build-plan]
    strategy:
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: win-x64
            os: ubuntu-latest
          - rid: osx-arm64
            os: macos-latest
    runs-on: ${{ fromJSON(needs.build-plan.outputs.reuse)[format('binaries-libjxl-{0}', matrix.rid)] && 'ubuntu-latest' || matrix.os }}
    env:
      REUSE: ${{ fromJSON(needs.build-plan.outputs.reuse)[format('binaries-libjxl-{0}', matrix.rid)] }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Download the binaries of the previous release
      if: env.REUSE == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: ./scripts/Get-ReleaseFiles.ps1 -Tag "${{ needs.build-plan.outputs.release }}" -Artifact binaries-libjxl-${{ matrix.rid }}
    - name: Build (Alpine, fully static against musl)
      if: env.REUSE != 'true' && startsWith(matrix.rid, 'linux-')
      shell: bash
      run: |
        # `docker run` rather than a job-level `container:`, as for ffmpeg-linux.
        image="$(bash scripts/docker-pull.sh "$ALPINE_IMAGE")"
        docker run --rm \
          -v "$PWD:/work" -w /work \
          -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
          -e ZLIB_VERSION -e LIBPNG_VERSION -e BROTLI_VERSION -e HWY_VERSION -e JXL_VERSION \
          "$image" sh -euc '
            apk add --no-cache build-base clang libstdc++-dev cmake ninja-build ninja-is-really-ninja \
              git curl bash perl pkgconf linux-headers tar
            # Everything written to /work is root-owned; hand it back to the
            # runner user so the next steps and the post-job cleanup work.
            trap "chown -R $HOST_UID:$HOST_GID /work || true" EXIT
            bash scripts/build-libjxl.sh ${{ matrix.rid }}
          '
    - name: Install build tools
      if: env.REUSE != 'true' && matrix.rid == 'win-x64'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential cmake ninja-build pkgconf git curl xz-utils file
    - name: Install llvm-mingw
      if: env.REUSE != 'true' && matrix.rid == 'win-x64'
      shell: bash
      run: |
        uri="https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/llvm-mingw-$LLVM_MINGW_VERSION-ucrt-ubuntu-22.04-x86_64.tar.xz"
        for attempt in 1 2 3 4 5; do
          if curl -fsSL "$uri" -o llvm-mingw.tar.xz && tar -tJf llvm-mingw.tar.xz > /dev/null 2>&1; then
            break
          fi
          if [ "$attempt" -eq 5 ]; then echo "failed to download llvm-mingw" >&2; exit 1; fi
          sleep $((2 * attempt))
        done
        mkdir -p "$HOME/llvm-mingw"
        tar -xJf llvm-mingw.tar.xz -C "$HOME/llvm-mingw" --strip-components=1
        echo "LLVM_MINGW_ROOT=$HOME/llvm-mingw" >> "$GITHUB_ENV"
        echo "$HOME/llvm-mingw/bin" >> "$GITHUB_PATH"
    - name: Cross-compile for Windows x64
      if: env.REUSE != 'true' && matrix.rid == 'win-x64'
      shell: bash
      run: bash scripts/build-libjxl.sh win-x64
    - name: Build (macOS)
      if: env.REUSE != 'true' && matrix.rid == 'osx-arm64'
      shell: bash
      # macOS has no static libSystem, so this cannot be fully static; the bar
      # is "no non-system dylibs", which verify-libjxl.sh asserts with otool -L.
      run: |
        brew install pkgconf cmake ninja
        bash scripts/build-libjxl.sh osx-arm64
    - name: Verify and smoke test
      if: env.REUSE != 'true'
      shell: bash
      # On the runner itself: for Linux this also checks that the musl binaries
      # run outside of Alpine. The Windows binaries are cross-compiled, so they
      # cannot be executed here; libjxl-windows-test runs their smoke tests.
      run: bash scripts/verify-libjxl.sh ${{ matrix.rid }} ${{ matrix.rid == 'win-x64' && 'link' || 'all' }}
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-libjxl-${{ matrix.rid }}
        if-no-files-found: error
        retention-days: 1
        path: |
           cjxl-${{ matrix.rid }}*
           djxl-${{ matrix.rid }}*
           jxlinfo-${{ matrix.rid }}*
           jxl_from_tree-${{ matrix.rid }}*

  libjxl-windows-test:
    runs-on: ${{ fromJSON(needs.build-plan.outputs.reuse)['libjxl-windows-test'] && 'ubuntu-latest' || 'windows-latest' }}
    needs: [build-plan, libjxl]
    env:
      REUSE: ${{ fromJSON(needs.build-plan.outputs.reuse)['libjxl-windows-test'] }}
    steps:
    - if: env.REUSE != 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - if: env.REUSE != 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: binaries-libjxl-win-x64
        path: .
    - name: Smoke test
      if: env.REUSE != 'true'
      shell: bash
      run: bash scripts/verify-libjxl.sh win-x64 run

  # jxl-oxide, a JPEG XL decoder written in Rust that shares no code with
  # libjxl. Its releases have no binaries any more, so it is built from the
  # jxl-oxide-cli package of crates.io (scripts/build-jxl-oxide.sh).
  # It needs libjxl for its smoke tests only: they decode files written by cjxl
  # and compare the result with what djxl decodes.
  jxl-oxide:
    needs: [build-plan, libjxl]
    strategy:
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: win-x64
            os: windows-latest
          - rid: osx-arm64
            os: macos-latest
    runs-on: ${{ fromJSON(needs.build-plan.outputs.reuse)[format('binaries-jxl-oxide-{0}', matrix.rid)] && 'ubuntu-latest' || matrix.os }}
    env:
      REUSE: ${{ fromJSON(needs.build-plan.outputs.reuse)[format('binaries-jxl-oxide-{0}', matrix.rid)] }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Download the binaries of the previous release
      if: env.REUSE == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: ./scripts/Get-ReleaseFiles.ps1 -Tag "${{ needs.build-plan.outputs.release }}" -Artifact binaries-jxl-oxide-${{ matrix.rid }}
    - name: Install musl-gcc
      if: env.REUSE != 'true' && startsWith(matrix.rid, 'linux-')
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends musl-tools
    - name: Build
      if: env.REUSE != 'true'
      shell: bash
      run: bash scripts/build-jxl-oxide.sh ${{ matrix.rid }}
    - if: env.REUSE != 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: binaries-libjxl-${{ matrix.rid }}
        path: .
    - name: Verify and smoke test
      if: env.REUSE != 'true'
      shell: bash
      run: bash scripts/verify-jxl-oxide.sh ${{ matrix.rid }} all
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-jxl-oxide-${{ matrix.rid }}
        if-no-files-found: error
        retention-days: 1
        path: jxl-oxide-${{ matrix.rid }}*

  # woff2_compress, woff2_decompress and woff2_info. google/woff2 publishes no
  # binaries, so every target is built from its sources (scripts/build-woff2.sh),
  # at a commit of its master branch: its last tag is from 2017.
  # brotli is the version ffmpeg is built with.
  # No Windows arm64 build, as for the image tools.
  woff2:
    needs: [build-plan]
    strategy:
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: win-x64
            os: ubuntu-latest
          - rid: osx-arm64
            os: macos-latest
